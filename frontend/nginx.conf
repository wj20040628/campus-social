# ============================================================
# 前端 Nginx:静态 + 反代 /api、/ws、/uploads 到后端
# 用于:1) 独立容器(前端 build 产物 + 此配置)  2) 本机生产部署
# 反代目标 host:校园社交(后端服务名)或 127.0.0.1:8080
# ============================================================

# ---- API 限速(2026-10-25,防爬/防刷) ----
# 游客可读接口(帖子/集市/活动详情)放行后,未认证 GET 无限流可被拖库。
# 这里按 IP 对全部 /api 限 20r/s + burst 40:正常用户一次页面加载并发
# 10-20 个请求不误伤;持续超速(脚本/爬虫)收到 503。
# 本文件被 include 进 http{},此处的 zone 声明即 http 级,合法。
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=uploads_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # 前端静态产物
    root /usr/share/nginx/html;
    index index.html;

    # ---- 小带宽优化:压缩传输(JS/CSS 体积可减少约 70%) ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # 慢连接保护(2026-10-29):默认 60s 对 3Mbps 小带宽太长,
    # 半开连接/慢速请求会一直占着 worker。超时只在「连续无进展」时触发,
    # 不影响正常弱网上传(25MB 视频只要每次读数间隔 < 30s 就不断)。
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;

    # Vite 产物文件名带内容 hash,可放心长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 入口必须 no-cache(2026-10-25):index.html 引用的 assets 带 hash,
    # 内容一变文件名就变;但 index.html 本身若被浏览器/中间层缓存,
    # 发新版后用户仍拿旧入口 → 引用的旧 chunk 404 → 白屏。
    # 每次 2KB 左右的入口回源校验,代价可忽略。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 外部探活(2026-10-29):云监控/UptimeRobot 打 https://域名/healthz。
    # 只反代 /actuator/health(show-details=never,响应仅 {"status":"UP"}),
    # 后端或数据库挂掉时返回 502/503,监控据此告警。
    # 不能拿 / 探活:SPA 回退对任意路径都回 200 index.html,后端挂了也显示「正常」。
    location = /healthz {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store";
    }

    # OSS 直传回调：必须把 POST 转给后端，否则静态目录直接 405
    location /upload/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传文件(后端静态资源,也反代)
    location /uploads/ {
        limit_req zone=uploads_limit burst=60 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # REST API:剥掉 /api 前缀(后端 context-path 无前缀,接口就是 /chat/... )
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 上传上限与后端一致(视频 25MB + multipart 开销),不再放 200m
        client_max_body_size 32m;
    }

    # WebSocket(需升级头)
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Vue SPA history 模式:非 /api /ws /uploads 一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
