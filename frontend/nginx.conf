# ============================================================
# 前端 Nginx:静态 + 反代 /api、/ws、/uploads 到后端
# 用于:1) 独立容器(前端 build 产物 + 此配置)  2) 本机生产部署
# 反代目标 host:校园社交(后端服务名)或 127.0.0.1:8080
# ============================================================

server {
    listen 80;
    server_name _;

    # 前端静态产物
    root /usr/share/nginx/html;
    index index.html;

    # 上传文件(后端静态资源,也反代)
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # REST API:剥掉 /api 前缀(后端 context-path 无前缀,接口就是 /chat/... )
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 大文件上传放宽
        client_max_body_size 200m;
    }

    # WebSocket(需升级头)
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Vue SPA history 模式:非 /api /ws /uploads 一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
