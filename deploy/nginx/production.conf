# 友声生产 Nginx 配置（基线抓取自 /etc/nginx/sites-enabled/default，2026-10-30 20:50 CST；
# 2026-11-13 增加过载保护：全站限流、连接上限、静态文件句柄缓存）
# 变更流程：改本文件 → 部署包内 apply-nginx.sh 备份并应用 → nginx -t → reload，失败自动回滚
# 已知差异：不做 per-IP 请求限流（校园 NAT 共用出口，按 IP 卡流量会误伤整栋楼），
#           改用「全站总量阈值 + 连接上限」；Docker 模板见 frontend/nginx.conf。
#
# ===== 过载保护（2026-11-13）=====
# 为什么是总量而不是按 IP：宣传期一个班/一栋楼可能共用一个出口 IP，按 IP 限 20r/s
# 会在冷启动瞬间把整栋楼打成 429。这里只设两道「保险丝」，阈值远高于正常操作，
# 用于把「雪崩式的排队超时」变成「快速 429 + 客户端重试」：
#   1) 请求总量 300r/s（burst 600）：2C2G 单机 /api/ 的稳定处理上限约 200-300r/s，
#      超过说明已经过载，继续放进来只会把 Tomcat 线程和 Hikari 连接占死；
#   2) 连接总数 1600：低于后端 max-connections=2000，先于 Tomcat 拒绝，
#      避免大量半开/排队连接把内存吃满。
# 宣传期若日志出现 429 且监控显示 CPU/内存仍有余量，先把 rate 调到 400r/s 再观察。
# 单 IP 恶意刷接口不在本层解决（Nginx 层无法既防刷又不误伤 NAT），交给云盾/WAF。
limit_req_zone $server_name zone=api_global:10m rate=300r/s;
limit_req_status 429;
limit_req_log_level warn;
limit_conn_zone $server_name zone=site_conn:10m;
limit_conn_status 429;
limit_conn_log_level warn;

# 静态文件元数据缓存：减少每条静态请求的 open/stat 系统调用（发布后页面会集中拉资源）。
# index.html 单独关闭（见下方 location = /index.html），避免发布替换后短时间读到旧入口。
# 不缓存 404：前端部署是「整目录换新」，换目录的一两秒内新资源还不在，
# 若把 404 缓存下来，发布后 30 秒内仍会有用户拿不到新 JS。
open_file_cache max=2000 inactive=60s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors off;

# ===== 80：IP 直连（应急用，保持 http 不跳转）=====
server {
    listen 80 default_server;
    server_name _ 120.26.4.66;
    # 上传上限按产品真实上限收口(2026-11-10):12m 覆盖 10MB 视频 + multipart 开销
    client_max_body_size 12m;

    # 静态文件零拷贝与聚合发送（2026-11-13）：降低高并发下的 CPU 与系统调用开销
    sendfile on;
    tcp_nopush on;

    # 全站连接上限，低于后端 max-connections=2000
    limit_conn site_conn 1600;

    # gzip：静态 JS/CSS/JSON 传输压缩（2026-10-30 基线）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/manifest+json;

    # 慢连接保护(2026-10-29):默认 60s,半开连接会长期占住 worker
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;

    # 安全响应头(2026-11-12):应急 IP 入口同样生效,口径见 443 段注释
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 公网探活(2026-10-29):外部监控打 /healthz,只透出 {"status":"UP"}
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store";
    }
    root /opt/campus/web;
    index index.html;

    location /api/ {
        # 全站总量限流：正常流量远达不到，只拦过载时的请求雪崩
        limit_req zone=api_global burst=600 nodelay;
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # OSS 直传回调：Nginx 必须把 POST 转给后端，否则静态目录直接 405
    location /upload/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=300" always;
    }
    location = /index.html {
        # 入口页不进出缓存：发布是「写文件替换」，句柄缓存会让部分用户短时间拿到旧入口
        open_file_cache off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=300" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ===== 80：域名一律跳 HTTPS =====
server {
    listen 80;
    server_name yousheng8.cn www.yousheng8.cn;

    # certbot 续期校验：这条路径必须能直接取到文件，不能跳 https
    location ^~ /.well-known/acme-challenge/ {
        root /opt/campus/web;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== 443：正式站点 =====
server {
    listen 443 ssl http2;
    server_name yousheng8.cn www.yousheng8.cn;

    ssl_certificate     /etc/letsencrypt/live/yousheng8.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yousheng8.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头(2026-11-12):不依赖业务代码的基础防护。
    # add_header 继承规则:location 内一旦有自己的 add_header,就会丢弃
    # server 级设置 —— 下面 /assets/ 与 = /index.html 必须重复声明。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # HSTS 先给 5 分钟观察期(2026-11-12),确认证书续期正常后再升到半年。
    # 一旦下发长周期 HSTS,证书异常时用户将无法手动跳过警告。
    add_header Strict-Transport-Security "max-age=300" always;

    # 上传上限按产品真实上限收口(2026-11-10):12m 覆盖 10MB 视频 + multipart 开销
    client_max_body_size 12m;

    # 静态文件零拷贝与聚合发送（2026-11-13）：降低高并发下的 CPU 与系统调用开销
    sendfile on;
    tcp_nopush on;

    # 全站连接上限，低于后端 max-connections=2000
    limit_conn site_conn 1600;

    # gzip：静态 JS/CSS/JSON 传输压缩（2026-10-30 基线）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_vary on;
