# 友声生产 Nginx 配置（抓取自 /etc/nginx/sites-enabled/default，2026-10-30 20:50 CST）
# 变更流程：改本文件 → 备份线上文件 → 应用 → nginx -t → systemctl reload nginx
# 已知差异：未启 per-IP 限流（校园 NAT 共用出口会误伤）；Docker 模板见 frontend/nginx.conf。
# ===== 80：IP 直连（应急用，保持 http 不跳转）=====
server {
    listen 80 default_server;
    server_name _ 120.26.4.66;
    # 上传上限按产品真实上限收口(2026-10-29):32m 覆盖 25MB 视频 + multipart 开销
    client_max_body_size 32m;

    # gzip：静态 JS/CSS/JSON 传输压缩（2026-10-30 基线）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/manifest+json;

    # 慢连接保护(2026-10-29):默认 60s,半开连接会长期占住 worker
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;

    # 公网探活(2026-10-29):外部监控打 /healthz,只透出 {"status":"UP"}
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store";
    }
    root /opt/campus/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # OSS 直传回调：Nginx 必须把 POST 转给后端，否则静态目录直接 405
    location /upload/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ===== 80：域名一律跳 HTTPS =====
server {
    listen 80;
    server_name yousheng8.cn www.yousheng8.cn;

    # certbot 续期校验：这条路径必须能直接取到文件，不能跳 https
    location ^~ /.well-known/acme-challenge/ {
        root /opt/campus/web;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== 443：正式站点 =====
server {
    listen 443 ssl http2;
    server_name yousheng8.cn www.yousheng8.cn;

    ssl_certificate     /etc/letsencrypt/live/yousheng8.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yousheng8.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传上限按产品真实上限收口(2026-10-29):32m 覆盖 25MB 视频 + multipart 开销
