name: CI

# ============================================================
# 最小 CI(2026-10-23 加,审查报告 TD-10 / 「基础设施建议」):
#   此前仓库没有任何 CI,后端测试红了 19 个也无人察觉 —— pre-push 钩子只跑前端门禁。
#   本流水线把「后端编译 + 测试」和「前端构建 + 门禁」都跑起来。
#
# 2026-11-01 增补:
#   - e2e 作业:真实 MySQL/Redis + 后端 jar + Vite + Chromium,
#     覆盖登录→发帖→评论、举报下架、禁言、注销六条主链路。
#     脚本在 e2e/(独立 npm 包),不再散落 .e2e-env 手工执行。
#
# 说明:
#   - 后端测试是 @SpringBootTest + @ActiveProfiles("local"),连真实 MySQL/Redis,
#     所以用 service container;application-local.yml 不入库,由 env 注入等价配置。
#   - 门禁脚本只跑正式脚本(run-all-gates.py 的 GATES 表),
#     scripts/ 下的一次性 diag/shot 脚本已 gitignore,不参与。
# ============================================================

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译 + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: campus_social_v2
        ports:
          - 3306:3306
        # 注意：这里的每一项都必须是 **docker 参数**。
        # 曾经写过 --character-set-server=utf8mb4 / --collation-server=...，
        # 那是 MySQL 服务端参数、要放在镜像名之后，而 GitHub 会把 options
        # 整体拼到镜像名**之前**，docker 认不出 → unknown flag → 退出码 125，
        # 表现为 "Initialize containers" 失败、整条流水线一步都没跑。
        # MySQL 8 的默认字符集本就是 utf8mb4 / utf8mb4_0900_ai_ci，无需再传。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 导入测试库基线
        run: |
          # 集成测试跑在独立库 campus_social_test(application-test.yml),不碰开发库。
          # schema.sql 顶部写死 campus_social_v2,替换库名后再导入。
          sed 's/campus_social_v2/campus_social_test/g' sql/schema.sql \
            | mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw --default-character-set=utf8mb4
          echo "表数:"
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='campus_social_test';"

      - name: 编译
        working-directory: backend
        run: mvn -B -DskipTests compile

      - name: 测试
        working-directory: backend
        env:
          # 与 application.yml 的 ${ENV:默认} 占位符对应;local profile 文件不入库,
          # 测试靠这些环境变量连上 service container
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_root_pw
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          JWT_ACCESS_SECRET: ci-access-secret-please-replace-with-64-bytes-random-value-xxxxxxxx
          JWT_REFRESH_SECRET: ci-refresh-secret-please-replace-with-64-bytes-random-value-yyyyyyyy
          APP_MESSAGE_GATEWAY: dev
          CAMPUS_EMAIL_DOMAIN_WHITELIST: campus.test
          UPLOAD_DIR: ./uploads
        run: mvn -B test

      - name: 测试失败摘要(写成 annotation 便于定位)
        # 失败原因只留在 surefire 报告里，而 artifact 需要登录才能下载。
        # 用 ::error:: 工作流命令把它变成 check-run annotation —— 公开仓库
        # 下通过 API 即可读到，不必登录，排查 CI 不必靠猜。
        if: failure()
        working-directory: backend
        run: |
          shopt -s nullglob
          found=0
          for f in target/surefire-reports/*.txt; do
            if grep -qE "Failures: [1-9]|Errors: [1-9]" "$f"; then
              found=1
              grep -E "Tests run:|<<< (FAILURE|ERROR)!|Caused by:|### Cause:|Duplicate entry|Exception" "$f" \
                | head -25 | while IFS= read -r line; do
                    echo "::error file=${f}::$(echo "$line" | tr -d '\r')"
                  done
            fi
          done
          if [ "$found" = "0" ]; then
            echo "::error::没有找到带失败的 surefire 报告 —— 可能是 Spring 上下文启动失败或编译期问题"
            ls -la target/surefire-reports/ 2>/dev/null || echo "(目录不存在)"
          fi
          # 无论上面如何，这一步不该改变 job 的成败
          exit 0

      - name: 上传测试报告(失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # 生产仍是 MySQL 8.0 + Redis 6；上面的 backend job 用 8.4/7 追新，
  # 本 job 锁定生产兼容基线，避免代码只在新版本上通过。
  backend-prod-versions:
    name: 后端测试（生产版本 MySQL 8.0 / Redis 6）
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: campus_social_v2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 导入测试库基线
        run: |
          # 与 backend 作业一致:测试库独立于开发库
          sed 's/campus_social_v2/campus_social_test/g' sql/schema.sql \
            | mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw --default-character-set=utf8mb4
          echo "表数:"
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='campus_social_test';"

      - name: 生产版本兼容测试
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_root_pw
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          JWT_ACCESS_SECRET: ci-access-secret-please-replace-with-64-bytes-random-value-xxxxxxxx
          JWT_REFRESH_SECRET: ci-refresh-secret-please-replace-with-64-bytes-random-value-yyyyyyyy
          APP_MESSAGE_GATEWAY: dev
          CAMPUS_EMAIL_DOMAIN_WHITELIST: campus.test
          UPLOAD_DIR: ./uploads
        run: mvn -B test

  frontend:
    name: 前端构建 + 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 门禁(11 条)
        run: python3 scripts/run-all-gates.py

      - name: 构建
        working-directory: frontend
        run: npm run build

      - name: 首屏体积护栏(AC-17:首屏 JS < 300KB gzip)
        working-directory: frontend
        run: node scripts/check-firstscreen-size.mjs

  # ============================================================
  # 端到端冒烟(2026-11-01):真实 MySQL + Redis + 后端 jar + Vite 前端 + Chromium。
  #
  # 为什么单开一个 job 而不是塞进 frontend:UI 用例要连真实后端;
  # 后端测试已经在别的 job 里覆盖接口细节,这里只验证「浏览器点得通、
  # 数据真的落库」——登录→发帖→评论、举报下架、禁言、注销。
  #
  # e2e/ 是独立 npm 包(自带 lockfile),不污染 frontend 依赖。
  # ============================================================
  e2e:
    name: E2E 冒烟（真实后端 + 浏览器）
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: campus_social_v2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_root_pw
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci-e2e-access-secret-please-replace-with-64-bytes-random-value-xxxxxxxx
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-please-replace-with-64-bytes-random-value-yyyyyyyy
      APP_MESSAGE_GATEWAY: dev
      UPLOAD_DIR: ./uploads
      # e2e 用例直连后端(不走 /api 前缀);浏览器侧仍走 Vite 代理
      E2E_API_BASE_URL: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_JWT_ACCESS_SECRET: ci-e2e-access-secret-please-replace-with-64-bytes-random-value-xxxxxxxx

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 导入 E2E 库基线
        run: |
          # schema.sql 顶部自带 CREATE DATABASE/USE campus_social_v2,与 E2E 服务库同名
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw --default-character-set=utf8mb4 \
            < sql/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='campus_social_v2';"

      - name: 构建后端 jar
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: 启动后端并等待健康检查
        run: |
          java -jar backend/target/campus-social.jar > /tmp/e2e-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend UP after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::后端 120s 内未就绪"
          tail -80 /tmp/e2e-backend.log
          exit 1

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 启动前端 Vite 并等待端口
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/e2e-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/login/form > /dev/null; then
              echo "vite UP after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Vite 120s 内未就绪"
          tail -80 /tmp/e2e-vite.log
          exit 1

      - name: 安装 E2E 依赖
        working-directory: e2e
        run: npm ci

      - name: 安装 Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: 跑 E2E
        working-directory: e2e
        run: npx playwright test

      - name: 失败时输出服务日志
        if: failure()
        run: |
          echo "===== backend ====="
          tail -120 /tmp/e2e-backend.log 2>/dev/null || echo "(无后端日志)"
          echo "===== vite ====="
          tail -60 /tmp/e2e-vite.log 2>/dev/null || echo "(无 Vite 日志)"

      - name: 上传 Playwright 报告(失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
