name: CI

# ============================================================
# 最小 CI(2026-10-23 加,审查报告 TD-10 / 「基础设施建议」):
#   此前仓库没有任何 CI,后端测试红了 19 个也无人察觉 —— pre-push 钩子只跑前端门禁。
#   本流水线把「后端编译 + 测试」和「前端构建 + 门禁」都跑起来。
#
# 说明:
#   - 后端测试是 @SpringBootTest + @ActiveProfiles("local"),连真实 MySQL/Redis,
#     所以用 service container;application-local.yml 不入库,由 env 注入等价配置。
#   - 门禁脚本只跑正式脚本(run-all-gates.py 的 GATES 表),
#     scripts/ 下的一次性 diag/shot 脚本已 gitignore,不参与。
# ============================================================

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译 + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: campus_social_v2
        ports:
          - 3306:3306
        # 注意：这里的每一项都必须是 **docker 参数**。
        # 曾经写过 --character-set-server=utf8mb4 / --collation-server=...，
        # 那是 MySQL 服务端参数、要放在镜像名之后，而 GitHub 会把 options
        # 整体拼到镜像名**之前**，docker 认不出 → unknown flag → 退出码 125，
        # 表现为 "Initialize containers" 失败、整条流水线一步都没跑。
        # MySQL 8 的默认字符集本就是 utf8mb4 / utf8mb4_0900_ai_ci，无需再传。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 导入数据库基线
        run: |
          # schema.sql 现在是完整基线(37 张表);MySQL service 已建库
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw --default-character-set=utf8mb4 \
            < sql/schema.sql
          echo "表数:"
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='campus_social_v2';"

      - name: 编译
        working-directory: backend
        run: mvn -B -DskipTests compile

      - name: 测试
        working-directory: backend
        env:
          # 与 application.yml 的 ${ENV:默认} 占位符对应;local profile 文件不入库,
          # 测试靠这些环境变量连上 service container
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_root_pw
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          JWT_ACCESS_SECRET: ci-access-secret-please-replace-with-64-bytes-random-value-xxxxxxxx
          JWT_REFRESH_SECRET: ci-refresh-secret-please-replace-with-64-bytes-random-value-yyyyyyyy
          APP_MESSAGE_GATEWAY: dev
          CAMPUS_EMAIL_DOMAIN_WHITELIST: campus.test
          UPLOAD_DIR: ./uploads
        run: mvn -B test

      - name: 测试失败摘要(写成 annotation 便于定位)
        # 失败原因只留在 surefire 报告里，而 artifact 需要登录才能下载。
        # 用 ::error:: 工作流命令把它变成 check-run annotation —— 公开仓库
        # 下通过 API 即可读到，不必登录，排查 CI 不必靠猜。
        if: failure()
        working-directory: backend
        run: |
          shopt -s nullglob
          found=0
          for f in target/surefire-reports/*.txt; do
            if grep -qE "Failures: [1-9]|Errors: [1-9]" "$f"; then
              found=1
              grep -E "Tests run:|<<< (FAILURE|ERROR)!|Caused by:|### Cause:|Duplicate entry|Exception" "$f" \
                | head -25 | while IFS= read -r line; do
                    echo "::error file=${f}::$(echo "$line" | tr -d '\r')"
                  done
            fi
          done
          if [ "$found" = "0" ]; then
            echo "::error::没有找到带失败的 surefire 报告 —— 可能是 Spring 上下文启动失败或编译期问题"
            ls -la target/surefire-reports/ 2>/dev/null || echo "(目录不存在)"
          fi
          # 无论上面如何，这一步不该改变 job 的成败
          exit 0

      - name: 上传测试报告(失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端构建 + 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 门禁(10 条)
        run: python3 scripts/run-all-gates.py

      - name: 构建
        working-directory: frontend
        run: npm run build

      - name: 首屏体积护栏(AC-17:首屏 JS < 300KB gzip)
        working-directory: frontend
        run: node scripts/check-firstscreen-size.mjs
