version: 2
# 依赖漏洞与版本升级走每周 PR，不在 CI 里硬卡审计结果（避免误伤发布）。
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
