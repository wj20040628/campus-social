spring:
  application:
    name: campus-social

  # ------------------------------------------------------------
  # 数据源(生产环境用环境变量覆盖)
  # ------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/campus_social_v2?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    # 用户名不设默认值:本地开发用 application-local.yml,生产用 MYSQL_USER 环境变量。
    # 默认 root 是 fail-open 反模式——缺配置时静默连 root,应让缺配置直接启动失败。
    username: ${MYSQL_USER:}
    # 密码不设默认值,本地开发用 application-local.yml,生产用 MYSQL_PASSWORD 环境变量
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ----------------------------------------------------------
    # 连接池(HikariCP,Spring Boot 默认自带)
    #
    # 为什么必须显式配:不配时 Spring Boot 用默认值 maximum-pool-size=10,
    # 也就是「最多 10 个请求能同时跟 MySQL 说话,第 11 个开始排队等」。
    # 默认的 connection-timeout 是 30 秒 —— 排队等满 30 秒才报错,
    # 用户看到的是「转圈半分钟然后失败」,而且这 30 秒里 Tomcat 线程一直被占着,
    # 会连锁把线程池也拖满。2 核机扛不住这种雪崩。
    # ----------------------------------------------------------
    hikari:
      pool-name: campus-hikari
      # 池子上限。不是越大越好:每条 MySQL 连接在服务端要占约 300-500KB
      # (会话缓冲 + 排序缓冲),8 条约 3-4MB,对 2G 机器是安全值。
      # 经验公式约为 CPU 核数 × 2 + 磁盘数;2 核取 8 已经留了余量。
      maximum-pool-size: 8
      # 常驻空闲连接数。设为 4 是为了避免「一波流量来了才开始建连接」:
      # 建一条 TCP + MySQL 握手约 5-15ms,冷启动时这点延迟会叠加到首屏。
      minimum-idle: 4
      # 拿不到连接时最多等多久(毫秒)。3 秒拿不到就直接失败,
      # 让前端快速看到错误、后端快速释放线程,比静默卡 30 秒好。
      # 注意:该值不能小于 250ms,否则 Hikari 启动时直接报错。
      connection-timeout: 3000
      # 池内连接空闲多久被回收(毫秒)。10 分钟。
      # 比 MySQL 的 wait_timeout(默认 8 小时)小得多,所以不会拿到已被服务端掐断的死连接。
      idle-timeout: 600000
      # 一条连接的最长寿命(毫秒)。30 分钟强制换新。
      # 作用有两个:①躲开 MySQL 的 wait_timeout;②让 DNS 切换/主从切换能自然生效。
      # 必须小于 MySQL 的 wait_timeout,否则会踩到「连接被服务端关了但池里还当它是好的」。
      max-lifetime: 1800000
      # 借出连接前做一次存活探测,超时上限(毫秒)。2 秒。
      # 探测走 JDBC4 的 isValid(),不发额外 SQL,开销可忽略。
      validation-timeout: 2000
  # ------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
  # ------------------------------------------------------------
  # 文件上传:本地磁盘 + 大小限制(前后端同一标准:图 7.5MB / 视频 10MB)
  # ------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  # 禁用默认静态资源映射(避免 /uploads/** 被拦截)
  web:
    resources:
      add-mappings: false
  # ------------------------------------------------------------
  # SMTP(QQ 邮箱)发验证码邮件
  # 授权码:QQ 邮箱 → 设置 → 账户 → 开启 POP3/SMTP 服务 → 生成 16 位授权码(非 QQ 密码)
  # 生产建议用环境变量覆盖:MAIL_USERNAME / MAIL_PASSWORD
  # ------------------------------------------------------------
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:}
    # 授权码不设默认值,本地开发用 application-local.yml,生产用 MAIL_USERNAME / MAIL_PASSWORD 环境变量
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志:生产关闭 stdout 全量打印(本地开发用 application-local.yml 打开)
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto


jwt:
  # HS512 要求密钥 ≥ 64 字节。不设默认值:
  # 本地开发用 application-local.yml,生产必须用强随机的 JWT_ACCESS_SECRET / JWT_REFRESH_SECRET 环境变量。
  access-secret: ${JWT_ACCESS_SECRET:}
  refresh-secret: ${JWT_REFRESH_SECRET:}
  # access 15min;refresh 默认 3d(不勾记住我),勾选记住我 7d
  # 账号体系重构 2026-10-17:原默认 7d 翻转为 3d,新增 remember 7d 配置
  access-ttl-millis: 900000
  refresh-ttl-millis: 259200000
  refresh-ttl-remember-millis: 604800000

upload:
  # 上传目录:相对路径,容器内可挂载
  dir: ${UPLOAD_DIR:./uploads}
  max-image-bytes: 7864320        # 7.5 MB
  max-video-bytes: 26214400      # 25MB(存储止血;原 50 MB 太大,15 个视频就 169 MB)
  # 视频功能总开关:true=正常收视频(受 max-video-bytes 限制);false=彻底关,
  # 拒收一切 video 上传并让前端隐藏视频入口。改这一个值 + 重启即可,零代码回滚。
  video-enabled: true
  # 图片压缩 / 转 WebP / 缩略图(OSS 接入降本①②)。仅作用于「后端经手字节」的
  # 上传路径(POST /upload 服务端兜底);前端直传(P4)压缩在浏览器侧做。
  image:
    enabled: ${UPLOAD_IMAGE_ENABLED:true}
    # 原图最长边上限(px),超则等比缩放到此内再编码,源头减量最大头
    max-edge: ${UPLOAD_IMAGE_MAX_EDGE:1920}
    # 缩略图最长边(px),头像/列表用小图,详情用原图
    thumb-edge: ${UPLOAD_IMAGE_THUMB_EDGE:480}
    # WebP 质量 0-100(插件缺失/编码失败自动回退 JPEG,上传永不因压缩失败)
    webp-quality: ${UPLOAD_IMAGE_WEBP_QUALITY:82}

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 200MB
    # ----------------------------------------------------------
    # 工作线程上限
    #
    # 默认是 200。这个值是为「8 核以上、大量阻塞 IO」的通用场景设的,
    # 放在 2 核 2G 的 ECS 上纯属浪费:
    #   - 线程多了并不会更快。2 个核同一时刻只能跑 2 条线程,
    #     200 条线程只会让操作系统频繁切换上下文(每次切换都要刷寄存器、换栈),
    #     真正干活的时间反而变少。
    #   - 每条线程即使闲置,栈上已触碰的页也要占 100-200KB 常驻内存,
    #     200 条线程大约吃掉 20-40MB,对 2G 机器是真金白银。
    # 100 条对「100 多个活跃用户 + 少量长任务」的场景仍有 50 倍以上的超额,
    # WebSocket 连接在 Tomcat NIO 里不占工作线程(挂在 poller 上),不在此列。
    # ----------------------------------------------------------
    threads:
      max: 100
      # 最小备用线程。保持 10 条热线程,避免流量一起来就现建线程。
      min-spare: 10
    # 当 100 条工作线程全忙时,新连接最多在操作系统的 accept 队列里排 100 个。
    # 排满后直接拒绝(连接被重置),让客户端快速重试,而不是无限堆积。
    accept-count: 100
    # 同时保持的连接总数上限(含 keep-alive 空闲连接和 WebSocket)。
    # 默认 8192 对小程序/浏览器场景没有意义,压到 2000:
    # 单条连接在内核里要占 socket 缓冲(几 KB 到几十 KB),
    # 2000 足够覆盖「500 个 WS + 数百个 HTTP keep-alive」,同时防止被大量空连接拖垮。
    max-connections: 2000

# ------------------------------------------------------------
# API 文档(2026-10-24 收口):默认关闭。
# 此前 /v3/api-docs/** 与 /swagger-ui/** 在 auth 白名单里且无开关,
# 63 条端点的完整契约对公网敞开——对攻击者是免费的攻击面地图。
# 默认 false:两端点 404(比 401 更不暴露"这里有个文档服务")。
# 本地开发要 swagger 时,环境变量 SWAGGER_ENABLED=true 再启动。
# 注意:WebMvcConfig 白名单里的 swagger 路径保留——开关打开时仍需免登录可达。
# ------------------------------------------------------------
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

# ------------------------------------------------------------
# 健康检查(TD-09):Nginx / 运维探活依赖 /actuator/health
# 只暴露 health 一个端点,exposure.include 不含
# env / configprops / beans —— 那几个会把数据库地址、配置项打给公网。
# show-details: never 让响应只有 {"status":"UP"},不带连接池/磁盘等组件明细。
#
# 注意:这里**没有**配 management.server.port,健康检查与业务共用 8080,
# 经 Nginx 转发后公网可达。这是有意的取舍,不是遗漏:
#   1) 只暴露 health 一个端点且不带详情,泄露面已经收敛到「服务活着没有」;
#   2) 2G 单机上再开一个独立监听 + 多一条防火墙规则,运维成本高于收益。
# 若将来确实要挪到内网独享端口,加 management.server.port 并同步改 nginx 与安全组。
# （此前这段注释声称「已独立监听,便于只在内网可达」,与实现不符,已按实际改写。）
# ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ------------------------------------------------------------
# 跨域白名单(TD-01 / TD-02,上线阻断项)
# 生产用 CORS_ALLOWED_ORIGINS 环境变量注入(逗号分隔),优先级高于下方配置项。
# 两者都为空时只放行本机开发端口,**任何情况下都不回落到通配符**。
# 改造前的 allowedOriginPatterns("*") 与 setAllowedOrigins("*") 已删除。
# ------------------------------------------------------------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    localhost-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5173
      - http://127.0.0.1:5174
  # F4 封禁计划在 Redis 中的最长保留天数。需>= 最长的封禁期限(30 天) + 余量,
  # 否则 Redis 重启后未到期的解封计划会先于 key 过期而丢失
  ban:
    max-plan-days: 45
  oss:
    # 存储桶(建桶时定死)
    bucket: ${OSS_BUCKET:yousheng-uploads}
    region: ${OSS_REGION:cn-hangzhou}
    # 外网域名:前端直传 / 浏览器读签名 URL 用
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    # 内网域名:ECS 后端拉头 / 回调校验用,免流量费
    internal-endpoint: ${OSS_INTERNAL_ENDPOINT:oss-cn-hangzhou-internal.aliyuncs.com}
    # STS 扮演的 RAM 角色 ARN
    role-arn: ${OSS_ROLE_ARN:acs:ram::1930391355152122:role/oss-uploader-role}
    # STS 服务接入点(地域级)
    sts-endpoint: ${OSS_STS_ENDPOINT:sts.cn-hangzhou.aliyuncs.com}
    # 上传回调地址(生产必须备案域名;本地 dev 不验证)
    callback-url: ${OSS_CALLBACK_URL:https://yousheng8.cn/upload/oss-callback}
    # 回调验签密钥(32 位 hex),生产 env 注入
    callback-key: ${OSS_CALLBACK_KEY:}
    # 前端直传开关:备案过审后才开(true)。备案中关(false),前端走 POST /upload 服务端兜底
    # (服务端直传 OSS 不依赖回调域名,备案中可用;直传才依赖回调到 yousheng8.cn)。
    direct-upload-enabled: ${OSS_DIRECT_UPLOAD_ENABLED:false}
    # 上传 STS 临时令牌用的固定 AK(仅后端,不下发前端)
    sts-access-key-id: ${OSS_STS_ACCESS_KEY_ID:}
    sts-access-key-secret: ${OSS_STS_ACCESS_KEY_SECRET:}
    # 后端生成读签名 URL 用的 AK(只 GetObject)
    read-access-key-id: ${OSS_READ_ACCESS_KEY_ID:}
    read-access-key-secret: ${OSS_READ_ACCESS_KEY_SECRET:}
    # 签名读 URL 有效期(秒)
    presign-ttl-seconds: 3600
    # STS 临时令牌有效期(秒),需 <= 角色最大会话时长
    sts-duration-seconds: 3600
    # 对象 key 前缀;DB 仍存 /uploads/... 形态,读时映射回 OSS key
    key-prefix: uploads
  campus:
    message-gateway: ${APP_MESSAGE_GATEWAY:aliyun}
    # 阿里云邮件推送(DirectMail)网关配置:仅 app.campus.message-gateway=aliyun 时生效
    # 生产用环境变量注入,切勿硬编码 AK/SK。本地开发走 dev(控制台打印)无需这些。
    aliyun:
      access-key-id: ${ALIYUN_DM_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_DM_ACCESS_KEY_SECRET:}
      region-id: ${ALIYUN_DM_REGION_ID:cn-hangzhou}
      # DM 接入点:默认公网 dm.aliyuncs.com;区域化可改 dm.<region>.aliyuncs.com
      endpoint: ${ALIYUN_DM_ENDPOINT:dm.aliyuncs.com}
      # 发信地址(AccountName),需先在 DM 控制台验证发信域名与发信地址
      from-address: ${ALIYUN_DM_FROM_ADDRESS:system@yousheng8.cn}
      # 发件人别名,如 友声
      from-alias: ${ALIYUN_DM_FROM_ALIAS:友声}
      # 0=随机发信地址(推荐) 1=用 from-address 发
      address-type: ${ALIYUN_DM_ADDRESS_TYPE:1}
      # 邮件标签(可选,DM 控制台统计用)
      tag-name: ${ALIYUN_DM_TAG_NAME:}
      # 控制台「模板管理」已审核邮件模板 ID;非空则 SingleSendMail 走模板发信
      # (忽略 HtmlBody,内容以模板为准,降低反垃圾风控),为空则回退直传 HtmlBody
      template-id: ${ALIYUN_DM_TEMPLATE_ID:445523}
      # 邮件标题:与控制台模板「邮件标题」保持一致(模板模式下标题以请求为准)
      subject: ${ALIYUN_DM_SUBJECT:系统验证码通知}
      # 凭据类型:ecs_ram_role(默认,走 ECS 实例元数据自动发/自动刷 STS,磁盘与 env 无 AK)
      #          access_key(回退,用上方 access-key-id/secret 环境变量,适用于本地或非 ECS)
      credential-type: ${ALIYUN_DM_CREDENTIAL_TYPE:ecs_ram_role}
      # ECS 实例绑定的 RAM 角色名(可空;空则 SDK 自动从实例元数据发现已绑定角色)
      role-name: ${ALIYUN_DM_ROLE_NAME:}

# ------------------------------------------------------------
# 校园信息与护栏参数(F2 / F3 / F11)
# 配额不硬编码:改一次要发一次版,而护栏参数恰恰需要按运营反馈调整。
# ------------------------------------------------------------
campus:
  # MVP 单校,不建 school 表——为一行数据建表属过度设计
  school-name: ${CAMPUS_SCHOOL_NAME:黄河交通学院}
  # 学校 ID,与 user.school_id / announcement.school_id 对齐。
  # 做成配置而非各处硬编码 1:多校字段已在库里,真要开第二所学校时只改这一处
  school-id: ${CAMPUS_SCHOOL_ID:1}
  # 校园邮箱域名白名单,逗号分隔。生产用 CAMPUS_EMAIL_DOMAIN_WHITELIST 注入。
  # 为空时所有域名都会被拒(1032),这是刻意设计:宁可不认证,不可错认证。
  email-domain-whitelist: ${CAMPUS_EMAIL_DOMAIN_WHITELIST:}
  # F3 免好友搭话护栏
  daily-new-peer-limit: 8     # 每天最多向 8 个新对象发起首条
  per-peer-daily-limit: 15     # 对同一陌生人每天最多 15 条
  # F11 引导
  onboarding-min-tags: 3
  onboarding-max-tags: 12
  max-tags: 12
  # 单个群最大成员数(拉人时校验,满员返 1045)。校园场景 500 足够,防超大群撑爆写扩散/未读
  group-max-members: ${CAMPUS_GROUP_MAX_MEMBERS:500}
  # ----------------------------------------------------------
  # 内容审核:信任闸门 + 举报阈值折叠(2026-10-24)。
  # 无 AI 机审模式下的队列瘦身与快速发现,详见 ReviewTrustService / ReportFoldService。
  # ----------------------------------------------------------
  review:
    # 受信用户账龄下限(天):已认证 + 注册满 N 天 + 信誉分≥60 的用户,
    # level-1 敏感词直接命中可豁免送审(替换后直发,audit_log 留痕)
    trust-min-days: ${CAMPUS_REVIEW_TRUST_MIN_DAYS:14}
    # 信誉扣分记录的计算窗口(天):窗口外的成立举报/封禁不再计分。
    # 信誉分 = 100 - 成立举报×20 - 封禁×40,受信要求 ≥60,动态查询不落库
    credit-decay-days: ${CAMPUS_REVIEW_CREDIT_DECAY_DAYS:180}
    # 集中举报自动封禁:24h 内 ≥N 个已认证的独立举报人举报同一用户(含其内容)
    # → 自动封禁 auto-ban-days 天,到期自动解封,管理员可提前手动解封;<=0 关闭
    auto-ban-reporters: ${CAMPUS_REVIEW_AUTO_BAN_REPORTERS:3}
    auto-ban-days: ${CAMPUS_REVIEW_AUTO_BAN_DAYS:3}
    # 同一帖子的独立待处置举报人数达到阈值 → 自动折叠(出 Feed)并进人审队列。
    # 管理员在审核台 approve 即恢复、reject 维持下架;<=0 关闭本机制
    report-fold-threshold: ${CAMPUS_REVIEW_FOLD_THRESHOLD:3}
    # 圈主协审升级窗口(小时):圈内待审任务超时未处理即滑入平台队列。
    # 不落列不起 Job,纯查询期按 create_time 计算
    owner-escalate-hours: ${CAMPUS_REVIEW_OWNER_ESCALATE_HOURS:24}

# ------------------------------------------------------------
# AI 内容机审(LLM):直接接真实 LLM API
# enabled=false(缺省)→ 不真调 LLM,机审走 manual 转人工兜底,本地无 key 也不崩
# 真实调用:本地开发用 application-local.yml 填 LLM_API_KEY,生产用环境变量
# provider=claude → 走 {base-url}/v1/messages;x-api-key + anthropic-version
# provider=openai → 走 {base-url}/chat/completions;Bearer key(可指本地/代理/兼容端点)
# ------------------------------------------------------------
llm:
  enabled: ${LLM_ENABLED:false}
  provider: ${LLM_PROVIDER:claude}
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:}            # 空=用 provider 默认(claude→api.anthropic.com / openai→api.openai.com/v1)
  model: ${LLM_MODEL:claude-sonnet-5}
  timeout-sec: ${LLM_TIMEOUT_SEC:30}

logging:
  level:
    root: INFO
    # 本地调试用 application-local.yml 打开 DEBUG;生产保持 INFO
    com.campus.social: INFO
    org.springframework.web: INFO
