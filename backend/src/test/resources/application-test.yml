# ============================================================
# 集成测试专用配置（入库，不依赖本机 application-local.yml）
#
# 激活方式：测试类 @ActiveProfiles({"local", "test"})
#   - local：本机数据库账号/密码、上传目录（该文件 gitignore；CI 中不存在，
#            账号密码由 MYSQL_USER/MYSQL_PASSWORD 环境变量提供）
#   - test ：本文件，后加载、优先级更高，只把「连哪个库」换掉
#
# 目的是让测试永远不写开发库 campus_social_v2：
#   - MySQL 换成独立测试库，本文件只覆盖 url，账号密码仍沿用 local/环境变量
#   - Redis 换到 15 号库，避免测试清理 file:view:* 之类前缀时误删开发数据
#
# 前置：测试库已建好并导入基线（库名可用 MYSQL_TEST_DB 覆盖）：
#   sed 's/campus_social_v2/campus_social_test/g' sql/schema.sql \
#     | mysql -h127.0.0.1 -uroot -p --default-character-set=utf8mb4
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_TEST_DB:campus_social_test}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
  data:
    redis:
      database: ${REDIS_TEST_DB:15}
