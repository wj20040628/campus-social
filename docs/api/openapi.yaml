        id:
          type: integer
          format: int64
        name:
          type: string
          example: 深夜自习室
        description:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        memberCount:
          type: integer
        commonTagCount:
          type: integer
        joined:
          type: boolean

    OnboardingRecommendCirclesResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [circles]
              properties:
                circles:
                  type: array
                  items:
                    $ref: '#/components/schemas/RecommendCircleItem'
                emptyHint:
                  type: string
                  nullable: true
                  example: 圈子还在建，你可以先关注几个同学

    # ---- 仅 message 的简单响应 ----------------------------------------------

    TokenPairData:
      type: object
      required: [accessToken, refreshToken, accessExpireAt]
      properties:
        accessToken:
          type: string
          # 用块标量而非单行：值里有 "Authorization: Bearer" 这个冒号+空格，
          # 单行写法会让 YAML 把 bearer 当成嵌套映射的键，直接解析失败。
          description: |
            业务访问令牌。放在请求头
            `Authorization: Bearer <accessToken>`
        refreshToken:
          type: string
          description: 刷新令牌，**只能发给 /auth/refresh**，不可当 accessToken 用
        accessExpireAt:
          type: integer
          format: int64
          description: accessToken 过期时刻（epoch 毫秒）。由 JwtUtil 签发时算出
          example: 1791450320000

    AdminVerifyPendingItem:
      type: object
      description: |
        一条待审的学号核验。字段刻意精简（OD-19 手机审核）：
        管理员判断真伪需要的是「学号 + 院系年级 + 昵称」，其余不下发。
      required: [userId, nickname, studentNo, dept, grade]
      properties:
        userId:
          type: integer
          format: int64
          description: 申请人 user.id，approve/reject 端点的路径参数就是它
        nickname: { type: string }
        studentNo:
          type: string
          description: 申请人填的学号（UNIQUE，同号已被别的账号占用时提交即 409）
        dept: { type: string, description: 院系名称快照 }
        grade: { type: string, description: 年级名称快照 }
        submittedAt:
          type: string
          format: date-time
          description: 提交时间（user.update_time），倒序排序键
        studentNoParsed:
          $ref: '#/components/schemas/AdminVerifyStudentNoParsed'

    AdminVerifyStudentNoParsed:
      type: object
      required: [parsed]
      description: |
        学号前 10 位的解析结果。规则经 5 个真实样本 + 教育部本科专业目录交叉验证：

          位 1-2   入学年份后两位
          位 3-6   教育部专业类代码（0809 计算机类 / 0802 机械类 / 0818 交通运输类）
          位 7-8   专业类内专业序号，与位 3-6 合起来是 6 位专业代码
                   （080901 计算机科学与技术 / 080910T 数据科学与大数据技术
                     / 080214T 智能车辆工程 / 081801 交通运输）
          位 9-10  班级
          位 11 起 流水号

        位 11 起的流水号长度未确认（已知样本里 23 级为 4 位、24/25 级为 3 位），
        因此**只解析前 10 位**，尾部不解析、不校验长度。

        专业名反查（专业代码 → 专业名称）需要「本校专业代码白名单」，尚未建表，
        故本对象**只回代码不回专业名**。调用方禁止自行拼接或猜测专业名称。
      properties:
        parsed:
          type: boolean
          description: |
            false 表示学号无法解析（不是纯数字、总长不在 12-14 位、或前 10 位不匹配）。
            此时其余四个字段一律为 null。**调用方必须显式处理这个分支，
            不允许用任何默认值或兜底逻辑填补** —— 展示错误的解析结果
            比展示「无法解析」危害更大，它会让管理员做出错误判断。
        entranceYear:
          type: integer
          nullable: true
          example: 2025
          description: 2000 + 位 1-2，即入学年份。不做「年份是否合理」的判断
        majorClassCode:
          type: string
          nullable: true
          example: '0802'
          description: 位 3-6，教育部专业类代码
        majorCode:
          type: string
          nullable: true
          example: '080214'
          description: |
            位 3-8，教育部 6 位本科专业代码。**不含特设专业的 T 后缀**：
            教育部目录里智能车辆工程记作 080214T、数据科学与大数据技术记作 080910T，
            而学号里只有数字，查表时须剥掉 T 再匹配。
        classNo:
          type: string
          nullable: true
          example: '02'
          description: 位 9-10 班级。注意保留前导零，必须按字符串处理

    AdminVerifyPageData:
      type: object
      required: [list, hasMore]
      properties:
        list:
          type: array
          items: { $ref: '#/components/schemas/AdminVerifyPendingItem' }
        nextCursor:
          type: integer
          format: int64
          nullable: true
          description: 下一页游标（最后一条的 userId），没有更多时为 null
        hasMore: { type: boolean }

    AdminVerifyPageResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AdminVerifyPageData' }

    AdminVerifyRejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: 驳回理由，必填——用户要靠它知道该怎么改。写 audit_log

    UserTrustStatusVO:
      type: object
      properties:
        trusted:
          type: boolean
          description: 是否受信（条件全满足）——命中 level-1 词的帖子可直接发布（展示时打码）
        verified:
          type: boolean
          description: 学号认证是否通过
        accountAgeDays:
          type: integer
          description: 账号已注册天数
        trustMinDays:
          type: integer
          description: 受信要求的账龄下限（天）
        hasBadRecord:
          type: boolean
          description: 近 credit-decay-days 天内是否存在成立举报或封禁史
        creditScore:
          type: integer
          description: |
            信誉分（2026-10-25 v2）：`60（基准）+ 产出加分 − 成立举报×20 − 封禁×40`，
            clamp 0..100。产出加分 = 近窗口过审帖与集市活动 ×1 分/条，封顶 +40
            （被下架/删除的内容不计）。受信线 60 = 基准：扣分掉线、产出补回。
            待审举报**不扣分**（防集中举报刷分），集中举报走自动封禁通道。
        creditBonus:
          type: integer
          description: 当前实际计入的产出加分（已按封顶截断）
        creditDecayDays:
          type: integer
          description: 信誉记录的计算窗口（天），与 campus.review.credit-decay-days 同值
        circleQuota:
          type: integer
          description: 可建圈子数上限（在世口径，解散/被封释放）。未认证 0；认证后随分数 1/2/3（75/90 分档）
        mktQuota:
          type: integer
          description: 集市同时在投上限（过期/暂停/删除释放）。未认证 0；认证后随分数 1/2/3（75/90 分档）
        postDailyQuota:
          type: integer
          description: 每日发帖上限。未认证 3，认证 30

    UserTrustStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserTrustStatusVO' }

    TrustBadgeVO:
      type: object
      description: 他人主页的公开信誉徽章（vo/TrustBadgeVO.java）。刻意只有一个字段
      required: [trusted]
      properties:
        trusted:
          type: boolean
          description: |
            是否受信（已认证 + 注册满 trust-min-days + 无成立举报 + 无封禁史）。
            false 的原因刻意不下发——前端对 false 不渲染，避免公开处刑与新号误读。

    TrustBadgeResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TrustBadgeVO' }

    # ---------------- admin-users（2026-10-24 新增） ----------------
    # schema 名与 Java VO 类名严格一致：verify-contract 门禁按同名比对字段，
    # 命名不一致等于免检（见该脚本的灵敏度说明）。
    UserAdminItemVO:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string, nullable: true }
        username:
          type: string
          nullable: true
          description: 登录标识（打码版，口径同审计日志 operatorName）
        avatarUrl: { type: string, nullable: true }
        studentNo:
          type: string
          nullable: true
          description: 学号；未提交认证的用户为 null
        dept: { type: string, nullable: true }
        grade: { type: string, nullable: true }
        verifyStatus:
          type: integer
          nullable: true
          description: 0 未认证 / 2 审核中 / 1 已认证 / 3 已驳回
        role:
          type: integer
          nullable: true
          description: 1 = 管理员（前端据此隐藏「封禁」按钮）
        status:
          type: integer
          description: 0 正常 / 1 冻结（封禁中）
        bannedUntil:
          type: string
          format: date-time
          nullable: true
          description: 解封时间；永久封禁为 null，未封禁也为 null——须与 status 同看
        createTime:
          type: string
          format: date-time

    UserAdminPageVO:
      type: object
      properties:
        list:
          type: array
          items: { $ref: '#/components/schemas/UserAdminItemVO' }
        nextCursor:
          type: integer
          format: int64
          nullable: true
        hasMore: { type: boolean }
        total:
          type: integer
          format: int64
          description: 当前筛选条件下的总用户数（不是本页条数）

    UserAdminPageResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserAdminPageVO' }

    UserBanRequest:
      type: object
      required: [banDays, reason]
      properties:
        banDays:
          type: integer
          minimum: 0
          maximum: 3650
          description: 0=永久；1/7/30 为常用档（与举报处置 BAN_DAY_OPTIONS 同一套语义）
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: 必填——半年后回看 audit_log 时「为什么封」只有这一句话可依赖

    PendingSummaryVO:
      type: object
      properties:
        reportPending:
          type: integer
          description: 待处置举报数（report status=0 且无人处理）
        reviewPending:
          type: integer
          description: 待人审机审任务数（review_task status=0）
        verifyPending:
          type: integer
          description: 待审核学号核验数（user verify_status=2）
        feedbackPending:
          type: integer
          description: 待处理意见反馈数（feedback status=0）

    PendingSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PendingSummaryVO' }

    TokenPairEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TokenPairData' }

    RegisterRequest:
      type: object
      required: [username, password, verifyCode]
      properties:
        username:
          type: string
          minLength: 5
          maxLength: 64
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$|^1[3-9]\d{9}$'
          description: 邮箱**或**大陆手机号，二选一。取自 RegisterDTO 的 @Pattern
          example: alice@campus.test
        password:
          type: string
          minLength: 6
          maxLength: 64
          description: 明文传输依赖 HTTPS；存库为 BCrypt
        verifyCode:
          type: string
          pattern: '^\d{6}$'
          description: 6 位数字，取自 `/auth/send-code` 的 `type=register` 验证码
        studentNo:
          type: string
          maxLength: 32
          nullable: true
          description: 学号，可选但**唯一**（库级 UNIQUE 约束，重复会 409）
        nickname:
          type: string
          maxLength: 64
          nullable: true
          description: 昵称，可选。为空时各卡片会退化显示脱敏后的 username

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
          description: 邮箱或手机号
        password: { type: string }

    LoginByCodeRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: |
            **这里是 `email` 不是 `target`**。`SendCodeDTO` 用 `target`
            因为它要同时支持手机号；本 DTO 只收邮箱。两者命名不一致是既有实现，
            前端按本字段名传。
        code:
          type: string
          pattern: '^\d{6}$'
          # 行首不能是反引号：YAML 会把 ` 当作非法 token 起始字符直接报错
          description: |
            `/auth/send-code` 发出的 `type=login` 验证码

    SendCodeRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          maxLength: 64
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$|^1[3-9]\d{9}$'
          description: 收码目标，邮箱或手机号
        type:
          type: string
          enum: [register, login, bind]
          default: register
          description: |
            用途。不传按 `register` 处理（DTO 字段自带默认值）。
            不同 type 是不同的 Redis 键，拿 login 的码去调注册会返回 1020。

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              properties:
                message:
                  type: string
                  example: 验证码已发送,5 分钟内有效

    ResultMeta:
      type: object
      description: |
        统一信封的 code / message。与 common/Result.java 一致：
        code=200 为成功；data 为 null 时被 @JsonInclude(NON_NULL) 省略
      required: [code, message]
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: 成功

