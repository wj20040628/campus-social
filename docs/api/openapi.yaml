        - type: object
          properties:
            data:
              type: object
              required: [postId]
              properties:
                postId: { type: integer, format: int64 }

    PostDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PostVO' }

    PostCursorPageResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [list, nextCursor, hasMore]
              description: |
                游标分页外壳，字段名与 `common/CursorPage.java` 严格一致。
                **没有 page / total**——帖子列表用游标，不用页码。
              properties:
                list:
                  type: array
