                    前端用它算「共 N 条，已加载 M 条」，**不必把
                    `childrenOverflowCount` 与本页长度反复相加**——
                    两处相加一旦漏一次就会显示错总数。

    # ---- F2 认证 -----------------------------------------------------------

    SchoolProfileRequest:
      type: object
      required: [deptId, gradeId]
      properties:
        schoolId:
          type: integer
          format: int64
          description: MVP 单校，恒为 1，不传默认 1
          default: 1
        deptId:
          type: integer
          format: int64
          description: |
            院系字典 id，取自 `GET /dict/school` 的 `depts`。
            **不接受院系名称字符串**——自由文本会让 AC-14 的同院系匹配漏人。
            id 不存在、已停用或不属于该 schoolId 时返回 422 `DEPT_INVALID`。
          example: 12
        gradeId:
          type: integer
          format: int64
          description: |
            年级字典 id，取自 `GET /dict/school` 的 `grades`。
            id 不存在或已停用（已毕业）时返回 422 `GRADE_INVALID`。
          example: 3

    SchoolProfileResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [schoolId, deptId, gradeId, profileComplete]
              properties:
                schoolId:
                  type: integer
                  format: int64
                schoolName:
                  type: string
                  nullable: true
                deptId:
                  type: integer
                  format: int64
                deptName:
                  type: string
                  nullable: true
                  description: 由服务端从字典表取出。前端直接显示，不必二次请求反查名称
                gradeId:
                  type: integer
                  format: int64
                gradeName:
                  type: string
                  nullable: true
                  description: 年级名称，如「2024级」
                profileComplete:
                  type: boolean
                  description: |
                    deptId 与 gradeId 均有值。false 时前端阻断进入 Feed（AC-18）。
                    兼容：字典化之前注册、只有名称没有 id 的用户仍返回 true。

    UserProfileUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 64
          description: 昵称。为 null 或不传则不更新该字段
        avatarUrl:
          type: string
          maxLength: 512
          description: 头像 URL。为 null 或不传则不更新该字段
        studentNo:
          type: string
          maxLength: 32
          description: 学号。变更时做全局唯一校验，重复返回 `STUDENT_NO_EXISTS`
      additionalProperties: true
      description: |
        三个字段全部可选，服务端只更新传入的字段。

        **不接受 `dept` / `grade`**：这两个字段已随字典化下线，改由
        `POST /user/school-profile` 或 `POST /onboarding/complete` 写入。
        传入 `dept` 或 `grade` 会返回 **400 `PROFILE_FIELD_RETIRED`**，不是静默忽略。

        `additionalProperties: true` 是刻意开放的：客户端版本差异可能带来无关字段，
        这些放行不报错；但上面两个已下线字段由服务端显式拦截并报错。

    UserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [id, username, nickname]
              properties:
                id:
                  type: integer
                  format: int64
                username:
                  type: string
                  description: 邮箱或手机号，中间部分脱敏
                nickname:
                  type: string
                avatarUrl:
                  type: string
                  nullable: true
                coverUrl:
                  type: string
                  nullable: true
                  description: |
                    个人主页自定义封面（相对路径 `/uploads/...`）。
                    `null` 表示未设置，客户端回落到默认渐变封面。

                    与 `avatarUrl` 一样只存相对路径，换域名/IP 不用刷库。
                grade:
                  type: string
                  nullable: true
                  description: 年级名称快照。存量用户可能是阶段口径（如「大三」），字典化后新写入的是入学年份口径（如「2026级」）
                dept:
                  type: string
                  nullable: true
                  description: 院系名称快照
                deptId:
                  type: integer
                  format: int64
                  nullable: true
                  description: |
                    院系字典 id。**存量用户为 NULL 但 dept 有值**，
                    所以判断「用户是否已填院系」必须看 dept 与 deptId 是否同时为空，
                    不能只看 deptId。
                gradeId:
                  type: integer
                  format: int64
                  nullable: true
                  description: 年级字典 id。同上，存量用户为 NULL 但 grade 有值
                followerCount:
                  type: integer
                followingCount:
                  type: integer
                unreadNotifyCount:
                  type: integer
                role:
                  type: integer
                  description: 0 普通用户 1 管理员
                createTime:
                  type: string
                  format: date-time

    CampusEmailSendRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 128
          example: 2024210123@mail.example.edu.cn

    CampusEmailConfirmRequest:
