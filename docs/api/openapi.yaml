                nextCursor:
                  type: integer
                  format: int64
                  nullable: true
                  description: 下一页游标。**为 null 即没有更多**，前端收到就停止翻页
                hasMore: { type: boolean }

    CreateCommentRequest:
      type: object
      description: |
        评论入参，字段来自 `dto/CreateCommentDTO.java`。
      required: [content]
      properties:
        content:
          type: string
          maxLength: 2000
          description: 评论正文。命中 level-0 敏感词拒发
        parentId:
          type: integer
          format: int64
          nullable: true
          description: |
            一级评论为 null；**二级评论填其所回复的那条一级评论 id**。
            三级场景下本字段当前**不参与通知归属判定**（见下方说明）。
        level:
          type: integer
          enum: [1, 2, 3]
          default: 1
          description: 1 一级 / 2 二级 / 3 三级，≤3
        replyToUserId:
          type: integer
          format: int64
          nullable: true
          description: |
            **被回复的人 id，仅三级评论有意义。**

            **服务端会校验此人是否参与过本帖讨论**（本帖存在他 status=1 的评论）；
            **校验不通过则降级为通知帖子作者，不报错**。

            也就是说：传了一个没在本帖说过话的人，**接口照样 200**，
            但通知会落到帖子作者头上。前端不会收到错误提示，
            所以传错id 时界面上看不出异常——这是「降级而非丢弃」的设计取舍：
            丢弃会让「我回复了人却没人收到」表现得像系统坏了，
            降级至少让通知有一个可解释的落点。

            **校验挡得住**：伪造他人 userId 定向骚扰、把A 帖的 id 传到 B 帖（跨帖骚扰）、
            前端 bug 导致的误传。
            **校验挡不住（已知局限，不视为缺陷）**：该用户确实参与过本帖讨论，
            但发评论者想通知的不是他——「回复意图」不在数据里，服务端无从区分。

            校验口径说明：之所以校验「是否参与过本帖」而不是「是否等于 `parentId` 的作者」，
            是因为三级评论走的是独立分支，实现里只有 `level == 2` 才会去查 `parentId`，
            三级路径上反查 `parentId` 取不到「本次回复对象」的可靠依据。
        mentionUserIds:
          type: array
          nullable: true
          description: |
            被 @ 的用户 id 列表（可空）。**必须传 id 不能只传昵称**——昵称可能重名，
            昵称匹配会 @ 错人。服务端按 id 精准发 type=9 通知，并自动排除自己、去重、
            跳过已失效用户
          items: { type: integer, format: int64 }

    CommentVO:
      type: object
      description: |
        评论卡片。字段与 `vo/CommentVO.java` 一一对应。

        **本对象出现在两个层级的响应里，语义不同**：
        - `GET /post/{id}/comments` 顶层数组 = **一级评论**（`level=1`），每项带一棵 `children` 树
        - 嵌套在 `children` 里的项 = 二级 / 三级评论，`children` 恒为 `[]`

        **历史（勿删）**：本契约早期版本 description 写的是「一级评论卡片」且**无 `children` 字段**，
        后端据此只返回一级、二三级在任何端点都取不到 → 用户点「回复」得200、
        刷新后回复消失。已由 team-lead 于 2026-10-08 补`children`（见下方字段说明）。
      required: [id, postId, userId, level, liked]
      properties:
        id: { type: integer, format: int64 }
        postId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/UserVO' }
        parentId:
          type: integer
          format: int64
          nullable: true
          description: |
            所回复的评论 id。一级评论为 null。

            **`level` 与 `parentId` 的对应关系（实现必须按下表，不得按字面理解）**：

            | level | parentId 填什么 |
            |---|---|
            | 1 | null |
            | 2 | **被回复的那条一级评论的 id** |
            | 3 | **其一级祖先的 id**，即被回复评论所在那一级回复的根 |

            **为什么三级填一级祖先而不是被回复评论的 id**：填直接父级会让三级在
            树里多出一层，前端渲染成 4 层缩进，违反设计「禁止楼层缩进超过 2 层」。

            **这是契约曾缺失、已由team-lead 于 2026-10-08 补齐的一条。**
            早期本字段只写「所回复的评论 id，一级评论为 null」，未说明三级填哪一级 ——
            按字面实现会把 `parent_id` 指向二级，二级与三级在
            `idx_post_parent(post_id, parent_id, level)` 里成为平级，
            前端按 parentId 建树时三级挂到二级下面，用户看到「我的回复不见了」。

            注意与通知归属的区别：通知归属里**只有 `level == 2` 才查 parentId**
            （见下方 `replyToUserId`），三级的通知目标由 `replyToUserId` 决定。
        level: { type: integer, enum: [1, 2, 3] }
        replyToUserId:
          type: integer
          format: int64
          nullable: true
          description: 被回复的人 id（= 入参原值，**不因降级而改写**）
        replyToNickname:
          type: string
          nullable: true
          description: |
            被回复者的昵称，供前端渲染「回复 @xxx」。
            **可能与实际通知接收人不一致**：入参 `replyToUserId` 校验不通过时，
            通知降级给了帖子作者，但评论内容里的被回复者仍是这里显示的这个人。
            这是「降级而非丢弃」的可见副作用。
        content: { type: string }
        likeCount: { type: integer, description: 评论点赞数。点赞对象是**评论**而非帖子 }
        liked: { type: boolean, description: 当前用户是否已赞这条评论 }
        createTime: { type: string, format: date-time }
        mentioned:
          type: object
          nullable: true
          description: |
            被 @ 的用户，**昵称 → id** 的映射。
            存 id 是因为昵称可能重名，前端渲染 @昵称 时据此跳对应主页。
            服务端序列化失败时该字段为 null，不阻塞评论展示。
        children:
          type: array
          default: []
          description: |
            **直接子回复**数组，元素仍是 `CommentVO`（递归同构）。

            - 一级评论 → 其二级回复
            - 二级评论 → 其三级回复
            - 三级评论 → 恒为 `[]`（**三级封顶**，`level` 上限 3）

            **上限与降级（不得静默截断）**：每个节点的 `children` 最多返回
            `MAX_CHILDREN_PER_NODE`（拟定 **20**）条。超限时：
            1. 按 `id` 升序取前 20 条（**取最老的**，保证回复链连续可读）
            2. 该节点的 `childrenOverflowCount` 置为剩余条数
            3. 前端对溢出部分显示「还有 N 条回复」，点击后调用
               `GET /post/{id}/comment/{commentId}/children` 拉取该节点的完整直接子回复列表

            `nextCursor` 的语义**不变**：仍按一级评论 id 游标分页，不因子树而改变。

        childrenOverflowCount:
          type: integer
          default: 0
          description: |
            该节点的直接子回复**因上限被截断的条数**。0 表示全部返回。
            存在于契约而非仅在文档，是为了让前端能区分
            「只有 2 条回复」和「还有 18 条没给你」。
          additionalProperties: { type: integer, format: int64 }

    CommentCreatedResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [commentId]
              properties:
                commentId: { type: integer, format: int64 }

    CommentCursorPageResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [list, nextCursor, hasMore]
              properties:
                list:
                  type: array
                  items: { $ref: '#/components/schemas/CommentVO' }
                nextCursor:
                  type: integer
                  format: int64
                  nullable: true
                hasMore: { type: boolean }

    CommentChildrenPageResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [list, nextCursor, hasMore, totalForParent]
