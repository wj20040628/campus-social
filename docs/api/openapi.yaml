openapi: 3.0.3

# =============================================================================
# 友声 · 校园生活社区  API 契约（MVP v1.0）
#
# 本文件是 Phase 2 放行门禁第 1 条。前端据此生成 TypeScript 类型与 MSW Mock，
# 后端据此实现 Controller。端点清单以 docs/SPEC.md §5 为唯一依据。
#
# 修改纪律：任何端点变更必须同步改本文件，并在 PR 描述里写明「spec 已改」。
# =============================================================================

info:
  title: 友声 · 校园生活社区 API
  version: 1.0.0
  summary: 校园社交 MVP 的对外 REST 契约
  description: |
    ## 0. 范围声明（本轮实现 / 不实现）

    - 本文件覆盖 `docs/SPEC.md` §5 端点清单中**本轮实现**的全部端点，共 **48 个方法 / 44 条路径**。
      （2026-10-08 补录 `/auth/*` 6 端点，此前的「41 方法 / 37 路径」把整个认证域漏在计数外。）
      计数由 `scripts/verify-openapi.py` 实测产出，不靠人工数——
      那份旧计数与实际差 6 条路径却没人发现，正说明手数不可信。
    - **帖子域与评论域（13 个端点 / 10 条路径）系Phase 2 补录**（SPEC §5.0）。
      原契约 27 个方法全是本轮新建的（举报 / 聊天 / 标签 / 公告 / 字典 / 认证 / 引导），
      帖子域被整体遗漏。但契约号称前后端唯一准绳，漏一整个域就等于契约失效——
      前端拿不到任何帖子接口的类型定义，这正是它 `grep parentId` 零命中的根因。
      本次补录路径以 `PostController.java` 实测为准（**实际 13 个方法**，
      分装在 10 条路径里：`/post/{id}` 一条承载 get+put+delete，`/post/{id}/like`
      一条承载 post+delete，故端点数少于路径数×2）。
      - 方法计数：13 = `/post` 1 + `/post/feed` 1 + `/post/hot` 1 + `/post/topic` 1
        + `/post/feed/following` 1 + `/post/mine` 1 + `/post/{id}` 3 + `/post/{id}/like` 2
        + `/post/{id}/comment` 1 + `/post/{id}/comments` 1
      - 路径计数：10 = 上述 10 条。合计 27 + 14 = **41 个方法**（`/user/me` PUT 已在原27 内，
        不重复计入）。
    - **`buddy_*` 端点本轮仅建表不实现，见 SPEC §2.2**。即下列 7 个端点在本文档中
      **不存在**，Phase 3 禁止实现其 Service / Controller / 页面：
      `POST /api/v1/buddy`、`GET /api/v1/buddy`、`GET /api/v1/buddy/{id}`、
      `POST /api/v1/buddy/{id}/join`、`DELETE /api/v1/buddy/{id}/join`、
      `GET /api/v1/buddy/mine`、`PATCH /api/v1/buddy/{id}/status`。
      对应 `buddy_post` / `buddy_join` 两张表的 DDL 照给（见 `docs/sql/migration_v1.sql`），
      但仅作预留，避免第二批迭代再改一次表。
    - 本轮实现的标签端点是 `GET /api/v1/tags`、`PUT /api/v1/user/tags`、
      `GET /api/v1/user/{id}/tags` —— 它们归属 F11 新用户引导（引导第 2 步要选标签），
      不是 F6「按标签找搭子」的发现页。
    - **院系与年级字典端点** `GET /api/v1/dict/school`（一次返回院系与年级）
      归属 F11 引导第 1 步。引导第 1 步原先让用户自由填写「学院 / 年级」，
      而 AC-14（同院系推荐 / 筛选）依赖院系相等判断——
      「计算机学院」与「计科」会落库成两个不同的值，同院系的人被漏掉一半，
      且院系改名后新老用户永久匹配不上。这两个端点把自由度收进字典表，
      `POST /user/school-profile` 与 `POST /onboarding/complete` 相应改为按 id 传入。
    - **`PUT /api/v1/user/me` 随字典化同步收窄**：请求体只剩 `nickname` / `avatarUrl` /
      `studentNo`，`dept` 与 `grade` 已下线（归属改走上面两个端点）。
      传入已下线字段返回 **400 `PROFILE_FIELD_RETIRED`**，**不静默忽略**——
      静默忽略会让调用方以为写入成功、实际数据未落库，
      这类「以为成功」的失败比直接报错难查得多。
    - **`POST /api/v1/admin/announcement` 与 `PATCH /api/v1/admin/announcement/{id}`
      额外要求「已通过校内认证」**（AC-11）：除管理员权限外，还需 `verify_status = 1`，
      否则 403 `USER_NOT_VERIFIED(1029)`。
      **为什么编辑与发布同权**：编辑能改 title / content，改完立即推给全校在线用户，
      效果与发布等价；只拦发布不拦编辑，等于留了一条绕行路径。
      读类端点（`GET /admin/announcement`、`GET /admin/announcement/{id}/unread-users`、
      `POST /admin/announcement/{id}/remind`）**不要求认证**——
      它们不产生新的对外内容，且已分别由 `@RequireAdmin` 与 service 层的
      「发布方本人或管理员」判定把关。

    - **`UserVO.verified`（AC-12徽章判据）**：由服务端给出，
      **前端不得从「是否填了院系 / 年级」反推**——那与认证是两个独立事实。

    ## 1. 路径前缀（ADR-008）

    所有端点对外部统一 `/api/v1` 前缀。后端 Controller 内部路由**无**版本前缀，
    由 Nginx 做 `rewrite ^/api/v1/(.*)$ /$1 break;` 映射（ADR-008 已知缺陷，见 OD-11）。
    因此：
    - 生产 / 联调环境：请求 `https://<domain>/api/v1/chat/send`
    - 本地 `curl localhost:8080` 直连后端：请求 `http://localhost:8080/chat/send`

    ## 2. 统一响应信封

    复用现有 `common/Result.java` 的结构，**不是** `{code:0,data,message}`：

    ```json
    { "code": 200, "message": "成功", "data": { } }
    ```

    - `code = 200` 表示成功；其余取值来自 `common/ResultCode.java` 枚举。
    - `message` 是人类可读文案，直接弹 toast，不做二次加工。
    - `data` 为 `null` 时该字段被 `@JsonInclude(NON_NULL)` 省略。

    ## 3. 分页语义

    复用现有 `common/CursorPage.java`，字段名严格一致（游标而非页码）：

    ```json
    { "list": [], "nextCursor": 12345, "hasMore": true }
    ```

    - 入参：`cursor`（上一页返回的 `nextCursor`，首页不传）+ `size`。
    - `nextCursor = null` 表示没有更多。
    - **已知不一致（登记为技术债）**：历史端点 `/chat/conversations`、`/chat/history`、
      `/review/*` 用的是 `lastId` 入参。本轮新增端点一律用 `cursor`，历史端点不动
      （不在本轮改造范围），待 v1.1 统一。

    ## 4. HTTP 状态码映射（`x-http-status-mapping`）

    现状：现有 `GlobalExceptionHandler.business()` 对业务异常一律返回 **HTTP 200**，
    错误只在响应体的 `code` 里。而 SPEC §9 AC-04 要求 429、§12 步骤 3.4 要求 403。
    **两者冲突，必须改后端**，本契约按「改后端」写。

    裁决：`GlobalExceptionHandler` 增加一张 ~12 项的 `code -> HTTP status` 映射表，
    **只映射下表列出的码，其余 1xxx 业务码保持 HTTP 200 不变**（零回归风险）。
    前端 `src/utils/request.js` 的错误分支已能读 `error.response.data.message` 弹 toast，
    故切换到真实 HTTP 状态码不会丢失提示文案。

    | ResultCode | 值 | HTTP |
    |---|---|---|
    | BAD_REQUEST | 400 | 400 |
    | UNAUTHORIZED | 401 | 401 |
    | FORBIDDEN | 403 | 403 |
    | NOT_FOUND | 404 | 404 |
    | CONFLICT | 409 | 409 |
    | UNPROCESSABLE | 422 | 422 |
    | TOO_MANY_REQUESTS（新增） | 429 | 429 |
    | USER_FROZEN | 1001 | 403 |
    | USER_CANCELLED | 1002 | 403 |
    | BLACKLISTED | 1013 | 403 |
    | NOT_ADMIN | 1025 | 403 |
    | USER_NOT_VERIFIED（新增） | 1029 | 403 |
    | STRANGER_MSG_CLOSED（新增） | 1030 | 403 |
    | ANNOUNCEMENT_NOT_FOUND（新增） | 1031 | 404 |
    | CAMPUS_EMAIL_NOT_ALLOWED（新增） | 1032 | 422 |
    | 其余 1xxx | — | 200（不变） |

    ## 5. 本轮需新增的 ResultCode 枚举项

    现有 `ResultCode.java` 共 54 项，缺以下 5 个语义。除 `TOO_MANY_REQUESTS` 用 HTTP 码段
    （枚举内本就混排 4xx 与 1xxx），其余接续 1xxx 段从 1029 起编号（现最大为 GROUP_NAME_EMPTY 1028）。

    | 新增项 | 值 | 文案 | 用到它的端点 |
    |---|---|---|---|
    | `TOO_MANY_REQUESTS` | 429 | 操作过于频繁,请稍后再试 | `POST /chat/send`（配额超限，message 会被覆盖为「今日搭话额度已用完，明天再来」） |
    | `USER_NOT_VERIFIED` | 1029 | 请先完成校内认证 | `POST /chat/send`、`POST /admin/announcement` |
    | `STRANGER_MSG_CLOSED` | 1030 | 对方已关闭陌生人消息 | `POST /chat/send` |
    | `ANNOUNCEMENT_NOT_FOUND` | 1031 | 公告不存在或已下架 | `GET /announcement/{id}`、`POST /announcement/{id}/read`、`PATCH /admin/announcement/{id}` |
    | `CAMPUS_EMAIL_NOT_ALLOWED` | 1032 | 该邮箱域名不是受信任的校园邮箱 | `POST /user/verify/campus-email` |

    凡是「校验不通过但语义已有现成码」的场景，**一律复用不新增**，例如：
    敏感词拦截用 `SENSITIVE_WORD_BLOCKED(1008)`、标签超 8 个用
    `UNPROCESSABLE(422)` 配自定义 message、验证码错误用 `CODE_INVALID(1020)`、
    非管理员用 `NOT_ADMIN(1025)`、双向黑名单用 `BLACKLISTED(1013)`。

    ## 6. 幂等约定

    `POST /report`、`POST /announcement/{id}/read`、`POST /onboarding/complete`
    三处均返回 **200 + `data.duplicated` 标记**，而不是 4xx。理由：重复提交是
    「无事发生」而非「出错」，前端不该弹红色错误 toast。
    响应体 `message` 在重复时回填为「已记录」/「已完成」，满足 SPEC §12 步骤 3.3 的断言。

  contact:
    name: 友声架构组
  license:
    name: 内部契约，未开源

servers:
  - url: https://{host}
    description: 生产 / 预发。Nginx 将 /api/v1/* 重写为后端内部无前缀路由（ADR-008）
    variables:
      host:
        default: api.yousheng.example
  - url: http://localhost:8080
    description: 本地直连后端。此 base 下需去掉 /api/v1 前缀，例如 /chat/send

security:
  - bearerAuth: []

tags:
  - name: report
    description: F4 举报提交（上线门槛项）
  - name: admin-report
    description: F4 举报处置（管理员，手机端可用，OD-19）
  - name: admin-users
    description: 用户处置（管理员，2026-10-24 新增）：找人 / 直接封禁 / 手动解封
  - name: admin-summary
    description: 管理端待办聚合（2026-10-24 新增）：入口角标的数据源
  - name: feedback
    description: 意见反馈提交（导航抽屉「意见反馈」）
  - name: admin-feedback
    description: 意见反馈审核（管理员，手机端可用）
  - name: chat
    description: F3 免好友搭话
  - name: tag
    description: 兴趣标签字典与用户标签（支撑 F11 引导第 2 步）
  - name: announcement
    description: F5 官方公告（前台）
  - name: admin-announcement
    description: F5 官方公告（后台，手机端可用，OD-19）
  - name: verify
    description: F2 校内身份归属与认证
  - name: dict
    description: 院系与年级字典（支撑 F11 引导第 1 步，人工维护不可写）
  - name: onboarding
    description: F11 新用户引导
  - name: post
    description: |
      帖子域（Phase 2 补录）。路径以 `PostController.java` 实测为准，该控制器
      `@RequestMapping("/post")`，实际暴露 13 个端点。本域原先整体遗漏于契约，
      前端拿不到类型定义是 `grep parentId` 零命中的根因。
  - name: comment
    description: 评论域（挂在 `PostController` 上，非独立控制器；`Comment` 无自己的 Controller）

paths:

  # ===========================================================================
  # §5.4.1 F2 学号核验审核（管理员）
  #
  # ★ Phase 2 补录，2026-10-09。为什么必须有：实测确认「浙江理工大学不给
  #   学生开通邮箱账号」（邮箱系统存在但账号从未发放），校园邮箱认证对
  #   全体学生不可用，学号核验成为唯一认证通道。而它此前只有提交端点、
  #   没有审核端点 —— 提交后 verify_status 永远停在 2（审核中），无人能批，
  #   所有用户过不了 AC-11，搭话/公告全废。这是上线阻塞项。
  #
  #   审核数据来源：user 表 verify_status=2 的行（student_no 列 + UNIQUE 防重），
  #   姓名后两位在 audit_log（migration 未增补 name_tail 列，见 ARCHITECTURE §3）。
  #   管理员凭学号格式 + 院系年级人工判断真伪（MVP 阶段管理员即站长本人）。
  # ===========================================================================

  /admin/verify/pending:
    get:
      operationId: listPendingVerify
      tags: [admin-verify]
      summary: 学号核验待审列表（管理员）
      description: |
        查 `verify_status = 2`（审核中）的用户，按提交时间倒序，游标分页。
        进入即 `roleService.requireAdmin(userId)`，非管理员 403 `NOT_ADMIN`（AC-20）。
        本页须在 375px 视口可用（OD-19）。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 待审学号核验游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVerifyPageResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/verify/{userId}/approve:
    post:
      operationId: approveVerify
      tags: [admin-verify]
      summary: 通过学号核验
      description: |
        `verify_status` 2→1（已认证），写 audit_log（actor=管理员）。
        目标不存在或状态非 2 时 404 `VERIFY_NOT_FOUND(1044)`。
        通过后用户即获得 AC-11 全部能力（搭话/发公告）。
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404':
          description: 404 `VERIFY_NOT_FOUND(1044)` 用户不存在或不在审核中状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/verify/{userId}/reject:
    post:
      operationId: rejectVerify
      tags: [admin-verify]
      summary: 驳回学号核验
      description: |
        `verify_status` 2→3（已驳回），reason 写 audit_log。
        驳回后用户可修改后重新提交（submitStudentNo 只拦 1/2 两种状态）。
        reason 必填——用户需要知道为什么被驳回才能改对。
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminVerifyRejectRequest' }
      responses:
        '200': { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404':
          description: 404 `VERIFY_NOT_FOUND(1044)` 用户不存在或不在审核中状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # §5.0 F1 认证与令牌（AuthController）
  #
  # ★ 这6 个端点是Phase 2 补录的，2026-10-08 之前整块缺失。
  #   缺它们的后果不是「少写了点文档」：登录注册是整个产品的入口，
  #   契约里搜不到任何 /auth/* 路径，前端要对接登录只能去读后端 Controller 源码。
  #   一份自洽但不含入口的契约，比明显残缺的契约更难发现——
  #   它所有其他部分都正确，不会触发任何「这里不对」的直觉。
  #   计数口径也随之修正：38 路径 / 42 方法 → 44 路径 / 48 方法。
  #
  # 字段口径全部取自 dto/*.java 的实际校验注解，不按自然语言猜：
  #   RegisterDTO.username  ^[^\s]+@...|^1[3-9]\d{9}$  （邮箱或手机号二选一）
  #   LoginByCodeDTO       email + code（**不是 target**，与 SendCodeDTO.target 不同名）
  # ===========================================================================

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: 注册并直接返回双 token
      description: |
        邮箱或手机号 + 密码 + 6 位验证码。`username` 接受两种形态：
        邮箱 `^[^@\s]+@[^@\s]+\.[^@\s]+$` 或大陆手机号 `^1[3-9]\d{9}$`。
        注册成功即登录，**不需再调一次 login**。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: 注册成功，返回 access/refresh 双 token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 账密登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/login-code:
    post:
      operationId: loginByCode
      tags: [auth]
      summary: 邮箱验证码登录（免密码）
      description: |
        复用 `/auth/send-code` 发出的 `type=login` 验证码。
        **注意字段名是 `email` 而非 `target`**——`SendCodeDTO` 用 `target`
        （它要同时支持手机号），`LoginByCodeDTO` 只收邮箱。
        两处命名不一致是后端既有实现，改动会波及已上线的前端调用，
        故在此显式标注而不是统一改名。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginByCodeRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairEnvelope' }
        '400':
          description: 400 `CODE_INVALID(1020)` 验证码错误或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/send-code:
    post:
      operationId: sendCode
      tags: [auth]
      summary: 发送验证码（注册 / 登录 / 绑定）
      description: |
        `type` 决定用途：`register` / `login` / `bind`，默认 `register`。
        6 位数字码、5 分钟 TTL、60 秒限频、每日 10 次上限；
        取出走 Redis Lua 原子读删（**禁用 `opsForValue().getAndDelete()`**——
        Redis 5.0 会抛 `ERR unknown command GETDEL`，已踩过一次坑，见 SPEC §11）。

        本地 profile 下 `message-gateway: dev`，码打到控制台并存 Redis，不真发信。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendCodeRequest' }
      responses:
        '200': { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: 429 `CODE_TOO_FREQUENT(1021)` / `CODE_LIMIT_REACHED(1022)`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: 用 refreshToken 换新的双 token
      description: |
        签发新refreshToken 并作废旧的（旋转式刷新）。
        `accessToken` 默认 15 分钟（900000ms），`refreshToken` 7 天。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 登出（当前 accessToken 立即失效）
      requestBody:
        required: false
      responses:
        '200': { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===========================================================================
  # §5.1 F3 免好友搭话 + F4 举报闭环
  # ===========================================================================

  /report:
    post:
      operationId: submitReport
      tags: [report]
      summary: 提交举报
      description: |
        幂等。同一用户对同一 `targetType + targetId` 重复提交时，不新增记录，
        返回 200、`duplicated = true`、`message` 为「已记录」（SPEC §9 AC-13）。
        唯一索引 `uk_report(reporter_id, target_type, target_id)` 兜底。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSubmitRequest'
      responses:
        '200':
          description: 举报已受理（含重复提交的「已记录」情形）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSubmitResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/reports:
    get:
      operationId: listAdminReports
      tags: [admin-report]
      summary: 举报列表（管理员）
      description: |
        进入即 `roleService.requireAdmin(userId)`，非管理员返回 403 `NOT_ADMIN`（AC-20）。
        默认 `status = 0`（待审）在前，按 `create_time` 倒序，游标分页。
        **本页必须在 375px 视口可用**（OD-19 / AC-14），故单次返回字段保持精简：
        不返回 `reason_text` 全量，超过 60 字截断并附 `reasonTextTruncated`。

        ## 用 handled 而不是 status 区分「待处理 / 已处理」

        `ignore` 按契约**不改变 status**（仍是 0），只写 `handler_id`。于是单看 status：
          - 待处理列表过滤不掉已忽略的（status 仍是 0，刷新后又冒出来）
          - 已处理列表也表达不出它（status 不是 1/2）

        `handler_id` 才是三种处置（ignore / reject / ban）都会落下的标记：
          - `handled=false` → 待处理：`status = 0 AND handler_id IS NULL`
          - `handled=true`  → 已处理：`handler_id IS NOT NULL`（含被忽略的）
          - 都不传 → 退回按 status 过滤（兼容旧调用）

        `handle_time` 三种处置都会写（原先忽略不写，导致已处理里查不到处置时间）。
      parameters:
        - name: handled
          in: query
          description: |
            true=已处理（含被忽略的，靠 handler_id 判定）；
            false=待处理（status=0 且无人处置过）。传了它就以它为准，status 被忽略。
          required: false
          schema:
            type: boolean
        - name: status
          in: query
          description: 0待审 1成立 2驳回。不传表示全部。仅在未传 handled 时生效
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 举报游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportPageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/reports/{id}/handle:
    post:
      operationId: handleAdminReport
      tags: [admin-report]
      summary: 处理举报（封禁 / 驳回 / 忽略）
      description: |
        处置动作三选一：
        - `ban` 成立并封禁目标用户，`banDays` 必填（1/7/30/永久用 0 表示）
        - `reject` 驳回，举报记录置 `status = 2`
        - `ignore` 忽略，不改变 `status`，仅记录处置人与备注（用于「已阅未处置」）

        `ban` 与 `reject` 需写 `audit_log`（复用现有 `AuditService`）。
        同一举报重复处置返回 409 `CONFLICT`。
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportHandleRequest'
      responses:
        '200':
          description: 处置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportHandleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin-users]
      summary: 用户处置列表（管理员）
      description: |
        按昵称/登录名/学号模糊搜 + 状态（0 正常 / 1 冻结）筛选，游标分页，按 id 倒序。
        2026-10-24 新增：此前封人只能走举报流程，找人/直接封禁/手动解封均无入口。
        `username` 打码下发（口径同审计日志 operatorName）；
        `bannedUntil` 仅冻结行有值，永久封禁为 null。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 昵称/登录名/学号模糊匹配；空 = 不筛
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: 0 正常 / 1 冻结（封禁中）；不传 = 全部
          schema: { type: integer, nullable: true }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 用户处置列表游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminPageResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/users/{userId}/ban:
    post:
      operationId: banUserDirect
      tags: [admin-users]
      summary: 直接封禁用户（不依赖举报流程）
      description: |
        2026-10-24 新增。此前封人唯一入口是举报处置——管理员看到刷屏 spam
        得先自己以用户身份举报、再去队列处置，绕一整圈。
        422：封自己 / 封管理员（封掉唯一管理员 = 后台锁死且无人能解封）；
        404：用户不存在。审计动作名 `account_ban`。
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserBanRequest' }
      responses:
        '200': { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/users/{userId}/unban:
    post:
      operationId: unbanUser
      tags: [admin-users]
      summary: 手动解封用户
      description: |
        2026-10-24 新增。此前 `BanService.unban` 的唯一调用方是到期定时任务——
        永久封禁误判后没有任何 API/UI 能撤销，只能改数据库。
        审计动作名 `account_unban`，operator 归因到操作管理员（非系统）。
        422：该账号不在封禁中（看的列表是旧的，应刷新）。
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/pending-summary:
    get:
      operationId: adminPendingSummary
      tags: [admin-summary]
      summary: 管理端待办聚合（四条队列一次拉全）
      description: |
        2026-10-24 新增。此前六个管理入口各自为政，每个队列的待审数
        要进对应页面才能看到——管理员必须逐页巡检才知道有没有活。
        本端点供抽屉/侧栏管理入口挂角标：举报 / 机审 / 学号核验 / 反馈。
      responses:
        '200':
          description: 四条队列的待办数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSummaryResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '500': { $ref: '#/components/responses/InternalError' }

  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: 提交意见反馈
      description: |
        提交即进入管理员审核队列（`status = 0`），由管理端处置。
        **不幂等**：同一个人可以重复提交（同一问题提两次是常事，
        反而说明用户很在意），故不返回 `duplicated` 标记，也不做唯一键去重。

        `content` 过长或含敏感词分别返回 422 `SENSITIVE_WORD_BLOCKED`；
        `media` 复用发帖的上传产物（OSS 相对路径），后端只校验数量与地址长度。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmitRequest'
      responses:
        '200':
          description: 反馈已进入待处理队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackSubmitResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/feedback:
    get:
      operationId: listAdminFeedback
      tags: [admin-feedback]
      summary: 反馈列表（管理员）
      description: |
        进入即校验管理员（非管理员 403 `NOT_ADMIN`）。游标按 `id` 倒序
        （不用 `create_time`：可能撞同一秒，会漏行或重复行）。
        `pendingCount` 是 `status = 0` 的**全量**总数，供手机端顶栏红点。
      parameters:
        - name: status
          in: query
          description: 0待处理 1已采纳 2已忽略。不传表示全部
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 反馈游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFeedbackPageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/feedback/{id}/handle:
    post:
      operationId: handleAdminFeedback
      tags: [admin-feedback]
      summary: 处置反馈（采纳 / 忽略）
      description: |
        `adopt` 采纳（`status = 1`）或 `ignore` 忽略（`status = 2`），
        `handleNote` **必填** —— 反馈是人对人的沟通，管理员什么都不写
        就点采纳，等于让提交者收到一句没有信息量的「收到」。

        不设「已修复」态：产品改没改只有开发者知道，让管理员去勾一个
        自己无法证实的状态，那个字段很快就会变成人人随手点的 noise。

        处置写 `audit_log`（`feedback_adopt` / `feedback_ignore`）；
        重复处置返回 409 `FEEDBACK_ALREADY_HANDLED`（乐观锁 `WHERE status = 0`）。

        **处置即回复**：`handleNote` 直接作为回复原文推给反馈提交者一条
        站内通知（`notify.type = 11`，`content` 存原文）。用户到 `/notify`
        列表看到「管理员回复了你的反馈：<原话>」，点开仅标已读不跳转。
        该推送走与点赞/评论通知同一条通道（写 `notify` 行 + 未读数 +1 + WS 实时推），
        乐观锁已挡掉重复处置，故不会重发。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackHandleRequest'
      responses:
        '200':
          description: 处置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackHandleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /chat/send:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: 发送消息（免好友搭话，含三重护栏）
      description: |
        **本端点是改造项，不是新增。** 现有实现在 `ChatController.java:43-56`
        的 `POST /chat/message`，`ChatServiceImpl.send()` 已不校验好友关系
        （`ChatServiceImpl.java:91-143`），免好友能力已存在，本轮只补护栏。

        路径由 `/chat/message` 改为 `/chat/send`（SPEC §5.1），需同步改
        `frontend/src/api/chat.js:15` 的 `request.post('/chat/message', ...)`。

        护栏执行顺序（顺序不可调换，先便宜后昂贵）：
        1. 不能给自己发 —— `CHAT_SELF(1014)`
        2. 未通过校内认证不得发起搭话 —— `USER_NOT_VERIFIED(1029)`（AC-11）
        3. 黑名单双向拦截（`relation.type = 3`）—— `BLACKLISTED(1013)`
        4. 接收方 `stranger_msg_enabled = 0` —— `STRANGER_MSG_CLOSED(1030)`（AC-05）
        5. 陌生人日配额（Redis ZSET 滑动窗口 Lua）—— `TOO_MANY_REQUESTS(429)`（AC-04）
        6. 敏感词过滤（复用 `SensitiveWordFilter`）—— 命中拦截并写 `review_task`（AC-06）

        配额配置进 `application.yml`，不硬编码：
        `stranger.daily-new-peer = 5`、`stranger.per-peer-daily = 20`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSendRequest'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSendResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            403。取值为 `BLACKLISTED(1013)` 双向黑名单、`USER_NOT_VERIFIED(1029)` 未认证、
            `STRANGER_MSG_CLOSED(1030)` 对方已关闭陌生人消息、`USER_FROZEN(1001)` 账号冻结
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 422。`SENSITIVE_WORD_BLOCKED(1008)` 内容含违规词（AC-06）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: |
            429 `TOO_MANY_REQUESTS`。今日搭话额度用尽。
            message 覆盖为「今日搭话额度已用完，明天再来」（AC-04）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500': { $ref: '#/components/responses/InternalError' }

  /chat/stranger-quota:
    get:
      operationId: getStrangerQuota
      tags: [chat]
      summary: 查询今日剩余破冰额度
      description: |
        前端在「搭句话」入口展示剩余次数，避免用户盲目试错后才发现被拒。
        不消耗额度。`resetAt` 为次日 00:00（服务器时区 Asia/Shanghai）的时间戳，
        前端据此做倒计时文案。
      responses:
        '200':
          description: 额度快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrangerQuotaResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # §5.2 兴趣标签（本轮实现；buddy 系列排除）
  # ===========================================================================

  /tags:
    get:
      operationId: listInterestTags
      tags: [tag]
      summary: 兴趣标签树（按 category 分组）
      description: |
        `interest_tag` 字典全量返回，按 `category` 分组、组内按 `sort` 升序再按 `id` 升序。
        不做分页：字典量恒定在 30–60 条。结果应缓存（本地 Caffeine 或 Redis，TTL 10min），
        字典变更由后台人工维护，低频。
      parameters:
        - name: category
          in: query
          description: 1兴趣 2游戏 3运动 4学习 5生活。不传返回全部分组
          required: false
          schema:
            type: integer
            enum: [1, 2, 3, 4, 5]
      responses:
        '200':
          description: 标签分组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagTreeResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /user/tags:
    put:
      operationId: replaceMyTags
      tags: [tag]
      summary: 设置我的兴趣标签（批量覆盖）
      description: |
        语义是**全量覆盖**，不是增量追加：传入的 `tagIds` 即最终集合，
        先删 `user_tag` 中本人的全部行再批量插入（同事务）。
        上限 8 个，超出返回 422 `UNPROCESSABLE`，message 为「兴趣标签最多选择 8 个」。
        `tagIds` 中若含不存在的 id，返回 400 `BAD_REQUEST`。
        `interest_tag.use_count` 在事务内 `SET use_count = use_count ± 1` 增减，绝不读改写。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTagsPutRequest'
      responses:
        '200':
          description: 已覆盖
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTagsPutResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
