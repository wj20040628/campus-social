    # ---- 字典（F11 引导第 1 步）-------------------------------------------

    DeptItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          description: school_dept.id。提交时原样回传给 POST /user/school-profile 的 deptId
          example: 12
        name:
          type: string
          description: 院系名称，仅供展示，不接受用户提交
          example: 计算机科学与技术学院
        sort:
          type: integer
          description: 排序权重，升序。服务端已排好序返回，此字段供前端本地重排时使用
          example: 10

    GradeItem:
      type: object
      required: [id, name, enrollYear]
      properties:
        id:
          type: integer
          format: int64
          description: school_grade.id。提交时原样回传给 gradeId
          example: 3
        name:
          type: string
          example: 2024级
        enrollYear:
          type: integer
          description: |
            入学年份。单独给出而不是让前端从 name 里截前 4 位——
            「2024级」「2024 级」「2024级本科」都能解析出 2024，
            截字符串等于把解析规则复制一份到每一处消费方。
          example: 2024
        sort:
          type: integer
          example: 30

    SchoolDictResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [schoolId, depts, grades, deptTotal, gradeTotal]
              properties:
                schoolId:
                  type: integer
                  format: int64
                  description: 本次院系列表所属的学校 id
                  example: 1
                depts:
                  type: array
                  description: 启用中的院系，按 sort 升序、id 升序兜底
                  items:
                    $ref: '#/components/schemas/DeptItem'
                grades:
                  type: array
                  description: |
                    启用中的年级，按 sort 升序（新近入学的排最前）。
                    不含已毕业年级（enabled=0），但那些年级在库中仍然保留，
                    以便历史用户的回显不显示空白。
                  items:
                    $ref: '#/components/schemas/GradeItem'
                deptTotal:
                  type: integer
                  description: 可选院系总数，前端用来显示「共 N 个院系」
                  example: 55
                gradeTotal:
                  type: integer
                  description: 可选年级总数（不含已毕业年级）
                  example: 6

    # ---- 帖子域 + 评论域（Phase 2 补录）---------------------------------
    #
    # 字段全部来自 vo/PostVO.java、vo/CommentVO.java、dto/CreatePostDTO.java、
    # dto/CreateCommentDTO.java 实测，一个字段都没凭想象加。
    # 改这些 schema 时请同步核对该 Java 文件，不要只改契约。

    CreatePostRequest:
      type: object
      description: |
        发帖 / 编辑**共用**同一入参（`dto/CreatePostDTO.java`）。
        `content` 在新建时必填、编辑时可空，所以契约层不用 required，
        由 service 对「content / media / topics 三者全空」做兜底拒绝。
      properties:
        content:
          type: string
          maxLength: 5000
          nullable: true
          description: 正文。命中 level-0 敏感词拒发；level-1 存原文并进审核
        media:
          type: string
          nullable: true
          description: |
            **JSON 字符串**，不是数组——形如
            `[{"type":"img","url":"/uploads/xxx"},{"type":"video","url":"...","dur":12}]`。
            用字符串是历史决定：后端用 Jackson 解析校验，避免为一个弱结构引入强类型。
            响应侧 `PostVO.media` 则是**已解析的 JSON 节点**，两者形态不同，
            前端不要把请求里的字符串直接当响应里的对象用。
        circleId:
          type: integer
          format: int64
          nullable: true
          description: 可选，挂到某圈子。非圈子成员发帖到该圈子返回 403
        topics:
          type: array
          nullable: true
          description: 话题名列表（**不带 #**）。写入 `post_topic` 关联表
          items: { type: string }
        anonymous:
          type: boolean
          nullable: true
          description: |
            树洞匿名帖标记。**仅创建时生效**——编辑请求里传了也会被忽略，
            匿名身份一次定终身。匿名帖的 `PostVO.author/authorId` 恒为 null。

    PostVO:
      type: object
      description: |
        帖子卡片 / 详情。字段与 `vo/PostVO.java` 一一对应。
        列表与详情**共用**这一个 schema——组装口径相同，不区分两个结构。
      required: [id, status, liked]
      properties:
        id: { type: integer, format: int64 }
        authorId:
          type: integer
          format: int64
          nullable: true
          description: 作者 id。**树洞匿名帖恒为 null**（保留会被 `/user/{id}` 反查主页，等于实名）
        author:
          $ref: '#/components/schemas/UserVO'
        content:
          type: string
          description: 正文
        media:
          type: array
          nullable: true
          description: |
            **已解析的 JSON 数组**（`PostVO.media` 是 `JsonNode`）。
            元素形如 `{type,url}` 或 `{type,url,dur}`。
            无媒体时为 null，被 `@JsonInclude(NON_NULL)` 省略。
          items: { type: object }
        status:
          type: integer
          enum: [0, 1, 2, 3]
          description: |
            0 审核中（不进 Feed）/ 1 通过 / 2 下架 / 3 已删除。
            **只有 status = 1 才会出现在任何 Feed 里**，
            前端若自行拼列表会漏掉这个过滤条件。
        likeCount: { type: integer, description: 点赞数 }
        favoriteCount:
          type: integer
          description: 收藏数（冗余列，与 likeCount 同构）
        commentCount: { type: integer, description: 评论数 }
        viewCount:
          type: integer
          description: 浏览数。每次 `GET /post/{id}` +1
        topics:
          type: array
          nullable: true
          description: 话题名列表（快手式 #话题#，**不含 # 号**）
          items: { type: string }
        hotScore:
          type: number
          format: double
          nullable: true
          description: 热度分。`/post/hot` 按它倒序分页
        circleId:
          type: integer
          format: int64
          nullable: true
        circleName:
          type: string
          nullable: true
          description: |
            所属圈子名。`circleId` 非空但本字段为 null 表示该圈已解散/被封禁
            （或查不到），前端此时**不渲染**圈子标签——给一个点进去 404 的
            链接比不显示更糟。由服务端按页批量下发（一次查询覆盖整页）。
        createTime:
          type: string
          format: date-time
          description: 本地时间（`LocalDateTime`，**不带时区后缀**）
        liked:
          type: boolean
          description: |
            当前登录用户是否已赞。未登录时恒为 false。
            游客拿到 false 是对的——没登录不可能点过赞。
        favorited:
          type: boolean
          description: |
            当前登录用户是否已收藏。未登录时恒为 false，语义与 `liked` 一致。
        isTop:
          type: boolean
          nullable: true
          description: 是否置顶（圈子内公告/置顶帖）。普通 Feed 里恒为 false 或 null
        anonymous:
          type: boolean
          description: |
            树洞匿名帖标记。为 true 时 `author/authorId` 恒为 null，
            前端统一渲染「匿名」作者并禁用「访问主页/搭话」入口；
            管理端（审核队列/举报处置/操作日志）不受此脱敏影响。
        mine:
          type: boolean
          description: |
            当前用户是否作者。匿名帖 authorId 已抹掉，前端靠本字段维持
            编辑/删除入口。详情接口 (`GET /post/{id}`) 恒可靠；
            Feed 列表里仅非缓存路径可靠（首屏共享骨架视角恒 false，卡片场景也用不到）。

    UserVO:
      type: object
      description: |
        用户卡片（脱敏，不含 passwordHash / studentNo 等敏感字段）。
        字段来自 `vo/UserVO.java`。
      properties:
        id: { type: integer, format: int64 }
        username:
          type: string
          description: 邮箱或手机号，**部分脱敏**（显示前几位 + 后几位）
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true }
        coverUrl:
          type: string
          nullable: true
          description: |
            个人主页自定义封面（相对路径 `/uploads/...`），`null` = 未设置，
            客户端回落到默认渐变封面。公开字段，访客也能看到。
        bio:
          type: string
          nullable: true
          description: |
            个人介绍（最多 200 字）。`null` / 空串 = 还没写，前端显示引导文案。
            它是主页上唯一能替代「脱敏学号」说明「你是谁」的安全字段。
        grade:
          type: string
          nullable: true
          description: |
            年级**名称快照**，如「2024级」。字典化之后仍保留为快照，
            是为了下游七八处列表查询能直接读 `user.grade` 而不必 join。
        dept:
          type: string
          nullable: true
          description: 院系**名称快照**，同上，非权威字段
        deptId:
          type: integer
          format: int64
          nullable: true
          description: |
            院系字典 id，与上面的名称快照**并存**。
            匹配与筛选以 id 为准，名称只是展示快照。
        gradeId:
          type: integer
          format: int64
          nullable: true
          description: 年级字典 id，与上面的名称快照并存
        majorId:
          type: integer
          format: int64
          nullable: true
          description: 专业字典 id（层次由 major.level 派生，不冗余存专业名）
        followerCount: { type: integer, nullable: true }
        followingCount: { type: integer, nullable: true }
        postCount:
          type: integer
          nullable: true
          description: 该用户发的动态数(按 author_id 现查 post 表,他人主页「动态」数字用)
        likeCount:
          type: integer
          nullable: true
          description: 获赞总数（SUM(post.like_count)，主页「获赞」指标，实时聚合不落冗余列）
        favoriteCount:
          type: integer
          nullable: true
          description: |
            我收藏的帖子数。**只在 GET /user/me（本人）填充**，他人卡片恒为 null ——
            收藏是纯私人数据，别人主页不需要也不该拿到。
        likedCount:
          type: integer
          nullable: true
          description: 我赞过的帖子数。填充规则同 favoriteCount
        joinedCircleCount:
          type: integer
          nullable: true
          description: 加入的圈子数（冗余计数，加圈/退圈事务内 ±1）
        unreadNotifyCount:
          type: integer
          nullable: true
          description: 未读通知数（红点）
        emailBound:
          type: boolean
          nullable: true
          description: 是否已绑定安全凭证邮箱。只在 GET /user/me / PUT /user/me 返回
        email:
          type: string
          nullable: true
          description: 已绑定的脱敏邮箱（如 ze***n@campus.test）。**仅本人视图**，他人卡片不含
        verified:
          type: boolean
          nullable: true
          description: |
            **是否已通过校内认证**。AC-12 的认证徽章判据，前端直接用这个字段，
            不要从「是否填了院系 / 年级」反推。

            **为什么必须由服务端给**：填写院系与通过认证是两个独立事实——
            用户可以在引导第 1 步填完院系却从未提交邮箱验证码。
            前端反推会在这种情况下显示「已认证」，等于伪造身份声明。

            只给两态不给四态：审核中（2）/ 被拒（3）属于「我的认证进度」，
            由 `GET /user/verify/status` 的 `verifyStatus` 承担。
            在此再放一份四态字段，两处口径一旦漂移就会让徽章显示错误状态。

            为 null 时按未认证处理。
        role:
          type: integer
          enum: [0, 1]
          nullable: true
          description: 0 普通用户 / 1 管理员
        strangerMsgEnabled:
          type: boolean
          nullable: true
          description: |
            我是否接收陌生人消息（AC-05 护栏开关）。
            **只在「我的资料」出口（`GET /user/me` 与 `PUT /user/profile`）有值**：
            这是隐私偏好，不应出现在他人卡片（{@code UserVoAssembler.of}）上，
            他人卡片的 UserVO 此字段为 null。
            默认开启（DB 为 1 或 NULL 时视为 true）。
            前端判据：`me.strangerMsgEnabled !== false`（null/undefined 视为开）。
        createTime: { type: string, format: date-time, nullable: true }

    # ---- 群（群信息头 + 群管理）--------------------------------------------
    # GroupVO / GroupMemberInfoVO / GroupMessageVO 与 Java vo/ 同名,
    # verify-contract.py 按同名逐字段比对。

    GroupVO:
      type: object
      description: 我的群会话列表项(群卡片 + 我侧未读 + 群主),来自 `vo/GroupVO.java`
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        ownerId: { type: integer, format: int64 }
        owner: { $ref: '#/components/schemas/UserVO' }
        memberCount: { type: integer }
        announcement:
          type: string
          nullable: true
          description: 群公告(可空,空=无),群信息头公告条来源
        myUnread: { type: integer }
        lastMsgId: { type: integer, format: int64, nullable: true }
        lastPreview: { type: string, nullable: true }
        lastMsgTime: { type: string, format: date-time, nullable: true }
        pinned:
          type: boolean
          description: 我对该群的置顶(chat_conv_pref),列表排序先排 pinned
        muted:
          type: boolean
          description: 我对该群的免打扰(chat_conv_pref)

    MemberItem:
      type: object
      description: 群成员项(嵌套于 GroupMemberInfoVO)
      properties:
        user: { $ref: '#/components/schemas/UserVO' }
        isOwner: { type: boolean }
        isSelf: { type: boolean }
        muted: { type: boolean }
        joinDate:
          type: string
          description: 入群日期 MM-dd(成员表 create_time 格式化,不是完整时间戳)

    GroupMemberInfoVO:
      type: object
      description: |
        群信息头出参(群名/人数/群主/公告 + 成员名单),来自 `vo/GroupMemberInfoVO.java`。
        字段 `user` / `isOwner` / `isSelf` / `muted` 是嵌套类 `MemberItem` 的字段,在成员名单
        每一项里出现;此处的顶层同名项是为让 verify-contract.py(按「类名==schema 名」
        且正则把所有 `private` 字段拍平)能读到的口径,并非 GroupMemberInfoVO 自身字段。
      properties:
        groupId: { type: integer, format: int64 }
        name: { type: string }
        ownerId: { type: integer, format: int64 }
        announcement: { type: string, nullable: true }
        memberCount: { type: integer }
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberItem' }
        user: { $ref: '#/components/schemas/UserVO' }
        isOwner: { type: boolean }
        isSelf: { type: boolean }
        muted: { type: boolean }
        joinDate:
          type: string
          description: 入群日期 MM-dd(嵌套 MemberItem 字段,此处拍平给 verify-contract)

    GroupMessageVO:
      type: object
      description: 群消息出参(镜像 ChatMessageVO),来自 `vo/GroupMessageVO.java`
      properties:
