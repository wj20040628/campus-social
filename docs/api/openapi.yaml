  # ===========================================================================
  # §5.3 F5 官方公告 —— 后台（管理员，手机端可用）
  # ===========================================================================

  /admin/announcement:
    post:
      operationId: createAnnouncement
      tags: [admin-announcement]
      summary: 发布公告（草稿或直接发布）
      description: |
        `publishNow = false` 时落 `status = 0`（草稿），不推 WS、不进前台列表。
        `publishNow = true` 时落 `status = 1`、`publish_time = now()`，
        并通过 `WsPushService` 向**当前在线**用户推一条轻量提示（`notify.type = 6 公告`，
        内容为标题 + id）。**不给全员写 notify 行**（SPEC §6.3：写入放大 1 万倍）。

        发布方必须已通过校内认证，否则 403 `USER_NOT_VERIFIED`（AC-11）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreateRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementCreateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

    get:
      operationId: listAdminAnnouncements
      tags: [admin-announcement]
      summary: 后台公告列表
      description: |
        含草稿与已下架，供管理端编辑。按 `publish_time` 倒序，游标分页。
        返回 `readCount` 与 `totalTargetCount`，供后台直接看触达率。
      parameters:
        - name: status
          in: query
          description: 0草稿 1已发布 2已下架。不传表示全部
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 后台公告游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnnouncementPageResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/announcement/{id}:
    patch:
      operationId: updateAnnouncement
      tags: [admin-announcement]
      summary: 编辑公告（含置顶 / 取消置顶 / 上架 / 下架）
      description: |
        部分更新，只传变化的字段。
        - `isTop = 1` 时必须同时给 `topExpireTime`，否则 422
        - `isTop = 0` 时服务端把 `top_expire_time` 置 NULL
        - `status = 2`（下架）后该公告从前台列表消失，已产生的 `announcement_read` 保留
        - 置顶生效到 `top_expire_time` 为止（AC-07），到期由定时任务或查询时过滤兜底
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementPatchRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementPatchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404':
          description: 404 `ANNOUNCEMENT_NOT_FOUND(1031)` 公告不存在或已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/announcement/{id}/unread-users:
    get:
      operationId: listAnnouncementUnreadUsers
      tags: [admin-announcement]
      summary: 谁还没看（未读名单）
      description: |
        **本端点由 SPEC §9 AC-10 反推补齐，SPEC §5.3 的 7 个端点清单里没有它。**
        AC-10 是 P0 验收项且明确要求「必须提供谁还没看名单」，缺端点则该 AC 无法验收。
        已作为阻塞项回传 team-lead，需补进 SPEC §5.3。

        实现：`NOT EXISTS (SELECT 1 FROM announcement_read r WHERE r.announcement_id = ? AND r.user_id = u.id)`
        过滤 `school_id` 相同、`status = 0`、`is_deleted = 0` 的用户。游标分页，不一次性拉全量。
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 未读用户游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementUnreadUsersResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404':
          description: 404 `ANNOUNCEMENT_NOT_FOUND(1031)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/announcement/{id}/remind:
    post:
      operationId: remindAnnouncementUnread
      tags: [admin-announcement]
      summary: 一键提醒未读人群
      description: |
        同样由 AC-10 反推补齐（SPEC §5.3 未列）。
        只对**当前在线**的未读用户推 WS 提示（`notify.type = 6`），离线用户不落库。
        同一公告同一管理员 60s 内不能重复提醒（Redis `setIfAbsent` 限频，Redis 5.0 安全 API），
        超限返回 429 `TOO_MANY_REQUESTS`。
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          description: 提醒已发出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementRemindResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404':
          description: 404 `ANNOUNCEMENT_NOT_FOUND(1031)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # §5.3 F5 官方公告 —— 前台
  # ===========================================================================

  /announcement:
    get:
      operationId: listAnnouncements
      tags: [announcement]
      summary: 前台公告列表（置顶优先）
      description: |
        排序：`is_top DESC`（且 `top_expire_time > now`）-> `publish_time DESC` -> `id DESC`。
        只返回 `status = 1` 且 `school_id` 与当前用户一致的公告。
        命中索引 `idx_school_status_top_time`。
      parameters:
        - name: category
          in: query
          description: 1教务 2后勤 3活动 4社团 5紧急 6其他。不传表示全部
          required: false
          schema:
            type: integer
            enum: [1, 2, 3, 4, 5, 6]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 公告游标分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementPageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /announcement/unread-count:
    get:
      operationId: getAnnouncementUnreadCount
      tags: [announcement]
      summary: 未读公告数（红点）
      description: |
        计算口径：`已发布且 school_id 匹配的公告总数 − 本人 announcement_read 中匹配的行数`。
        用两条 count 查询，不做全量写入（SPEC §6.3）。
        结果缓存 30s（Redis），新公告发布时主动删该用户的缓存键。
      responses:
        '200':
          description: 未读数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementUnreadCountResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /announcement/{id}:
    get:
      operationId: getAnnouncement
      tags: [announcement]
      summary: 公告详情（返回 isRead）
      description: |
        返回 `isRead`：当前用户是否已读过。
        **本接口不写已读** —— 已读必须走 `POST /announcement/{id}/read` 显式上报，
        否则「打开即已读」会让「谁还没看」名单失真，AC-10 无法成立。
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          description: 公告详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 404 `ANNOUNCEMENT_NOT_FOUND(1031)` 公告不存在、是草稿或已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500': { $ref: '#/components/responses/InternalError' }

  /announcement/{id}/read:
    post:
      operationId: markAnnouncementRead
      tags: [announcement]
      summary: 已读回执（幂等）
      description: |
        幂等：重复提交返回 200、`duplicated = true`、`message` 为「已记录」，
        `announcement_read` 不新增行（AC-09）。唯一索引 `uk_ann_user(announcement_id, user_id)` 兜底。
        `announcement.read_count` 仅在**首次**已读时 `SET read_count = read_count + 1`。
      parameters:
        - $ref: '#/components/parameters/AnnouncementId'
      responses:
        '200':
          description: 已记录（含重复提交的「已记录」情形）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementReadResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 404 `ANNOUNCEMENT_NOT_FOUND(1031)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # §5.0 帖子域 + 评论域（Phase 2 补录）
  #
  # 路径与字段全部来自 PostController.java / PostVO.java / CommentVO.java /
  # CreatePostDTO.java / CreateCommentDTO.java 实测，非凭记忆。
  # ===========================================================================

  /post:
    post:
      operationId: createPost
      tags: [post]
      summary: 发动态
      description: |
        敏感词**分级**处理，不是简单拒绝：
        - level-0（严重词）→ 拒发，返回 422 `SENSITIVE_WORD_BLOCKED(1008)`
        - level-1（ mild 词）→ **存原文并进审核队列**，帖子 `status = 0`（审核中），
          此时不进入任何 Feed；`review_task` 同帖只入队一次，重复提交不产生第二行

        发帖成功即触发**写扩散**：向粉丝的 `feed_item` 收件箱各插一行。
        单条插入失败只记 warn，不中断其余粉丝、也不回滚发帖事务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: 已创建。`status = 0` 表示进审核中，仍返回 postId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCreatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /post/feed:
    get:
      operationId: listMyFeed
      tags: [post]
      summary: 写扩散 Feed（我关注的）
      description: |
        游标分页。`by` 支持 `time`（默认）与热度维度，`order` 支持 `desc` / `asc`。
        `topic` 可选，按话题名过滤。

        **已知局限（不是缺陷，QA 勿当 bug 报）**：`by` 为非 `time` 维度时，
        游标只用单一 `id`，多条记录同值可能导致翻页重复或漏。**原实现即如此**，
        本次只是把行为写进契约，不在MVP 修复。
      parameters:
        - name: lastId
          in: query
          description: 上一页的 nextCursor。首页不传
          required: false
          schema: { type: integer, format: int64, nullable: true }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - name: by
          in: query
          description: 排序维度。不传默认 `time`
          required: false
          schema: { type: string, default: time, enum: [time, hot] }
        - name: order
          in: query
          required: false
          schema: { type: string, default: desc, enum: [desc, asc] }
        - name: topic
          in: query
          description: 话题名过滤（不带 #）
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Feed 页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCursorPageResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /post/hot:
    get:
      operationId: listHotPosts
      tags: [post]
      summary: 探索页（热门）
      description: |
        按 `hot_score` 倒序的游标分页，游标字段是 `lastHotScore` 而非 `lastId`
        ——热度值可能相同，所以这里的分页天然可能重复或漏，取热榜可接受。
      parameters:
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - name: lastHotScore
          in: query
          description: 上一页最后一条的热度值。首页不传
          required: false
          schema: { type: number, format: double, nullable: true }
      responses:
        '200':
          description: 热门帖列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCursorPageResponse'
        '500': { $ref: '#/components/responses/InternalError' }

  /post/topic:
    get:
      operationId: listPostsByTopic
      tags: [post]
      summary: 话题落地页
      parameters:
        - name: topic
          in: query
          required: true
          description: 话题名（不带 #）
          schema: { type: string }
        - name: lastId
          in: query
          required: false
          schema: { type: integer, format: int64, nullable: true }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: 该话题下的帖子
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCursorPageResponse'
        '500': { $ref: '#/components/responses/InternalError' }

  /post/feed/following:
    get:
      operationId: listFollowingFeed
      tags: [post]
      summary: 关注的人的帖子（读 feed_item 收件箱）
      description: |
        与 `/post/feed` 的区别：这里**直读 `feed_item` 收件箱**（写扩散的产物），
        查的是「已投递到我信箱的」，而不是实时 join 关注关系。
        未登录返回 401（此端点不降级为游客视角）。
      parameters:
        - name: lastId
          in: query
          required: false
          schema: { type: integer, format: int64, nullable: true }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: 收件箱中的帖子
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCursorPageResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /post/mine:
    get:
      operationId: listMyPosts
      tags: [post]
      summary: 某用户发的帖子
      parameters:
        - name: lastId
          in: query
          required: false
          schema: { type: integer, format: int64, nullable: true }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: 我发的帖子
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCursorPageResponse'
        '500': { $ref: '#/components/responses/InternalError' }

  /post/{id}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getPost
      tags: [post]
      summary: 帖子详情
      description: |
        每次调用 `view_count +1`。未登录也能看（`auth` 可选），此时 `liked` 恒为 false。
        帖子不存在、已下架或已删除统一返回 404 `POST_NOT_FOUND(1009)`，
        **不区分这三种状态**——区分开等于告诉别人「这个 id 曾经存在过」。
      responses:
        '200':
          description: 帖子详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailResponse'
        '404':
          description: 404 `POST_NOT_FOUND(1009)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: editPost
      tags: [post]
      summary: 编辑动态（仅作者）
      description: |
        `content` **可空**：允许只改话题或媒体而保留原内容，所以 DTO 层不用
        `@NotBlank`，改由service 对「三者全空」做兜底拒绝（语义比注解更准确）。

        三类失败都返回 4xx，不会静默成功：非作者 → 403 `NOT_POST_AUTHOR(1011)`；
        帖子不存在 / 已删→ 404；内容命中 level-0 敏感词 → 422。

        命中 level-1 敏感词时**存原文并重新入队审核**，`review_task` 同帖只保留一行
        （重复入队会撞唯一键，所以要先清空 `reviewer_id` 与 `reason`、把 `status` 退回 0）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: 编辑后的完整帖子
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: 403 `NOT_POST_AUTHOR(1011)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: 404 `POST_NOT_FOUND(1009)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deletePost
      tags: [post]
      summary: 软删除（仅作者）
      description: |
        路径名叫delete，实现是**级联硬删**：`post`、`post_topic`、`post_media`、
        `like`、`comment`（按帖物理删光）、`feed_item` 六张表一起清。
        非作者 → 403 `NOT_POST_AUTHOR(1011)`。重复删除返回 404。
      responses:
        '200':
          description: 已删除。data 为 null（被 `@JsonInclude(NON_NULL)` 省略）
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 403 `NOT_POST_AUTHOR(1011)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: 404 `POST_NOT_FOUND(1009)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500': { $ref: '#/components/responses/InternalError' }

  /post/{id}/like:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      operationId: likePost
      tags: [post]
      summary: 点赞
      description: 幂等：重复点赞不报错，`like_count` 不再增长。成功后推送通知给作者。
      responses:
        '200':
          description: 已点赞
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 404 `POST_NOT_FOUND(1009)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: unlikePost
      tags: [post]
      summary: 取消点赞
      description: 幂等：未点赞时取消也不报错，`like_count` 不减到负数。
      responses:
        '200':
          description: 已取消点赞
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 404 `POST_NOT_FOUND(1009)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500': { $ref: '#/components/responses/InternalError' }

  /post/{id}/comment:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      operationId: createComment
      tags: [comment]
      summary: 发评论
      description: |
        `level` 1/2/3，≤3，缺省为 1。评论同样过敏感词（命中 level-0 直接拒发）。

        **通知归属**（发错人会让用户收到与自己无关的红点）：
        - `level = 1` → 通知帖子作者
        - `level = 2` 且传了 `parentId` → 通知 `parentId` 指向的评论作者
        - `level = 3` → 见下方 `replyToUserId` 的校验与降级规则

        评论落库 + 帖子 `comment_count +1` + 热度分上升 + 通知，
        四者在**同一事务**内。@提及（`mentionUserIds`）另发 `type = 9` 通知，
        按 id 精准发（昵称不唯一，不能靠正文反查）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: 已创建。返回 commentId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCreatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 404 `POST_NOT_FOUND(1009)`（含帖子已下架 / 不可评论）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /post/{id}/comment/{commentId}:
    delete:
      operationId: deleteComment
      tags: [comment]
      summary: 删除自己的评论（连同其子回复）
      description: |
        2026-10-24 新增——此前评论无任何删除手段，发错/发敏感内容只能找管理员改库。
        仅作者本人可删：403 `FORBIDDEN` 删他人的；404 `COMMENT_NOT_FOUND` 不存在或已删。
        删除范围是整棵子树（父 + 全部子孙一起软删），评论计数与热度分按实际删除行数扣减，
        与 ReconcileJob 的对账口径一致。写 audit_log（delete_comment）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: commentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 404 `COMMENT_NOT_FOUND(1043)` 评论不存在或已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500': { $ref: '#/components/responses/InternalError' }

  /post/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: listPostComments
      tags: [comment]
      summary: 评论列表（一级 + 各条的子树）
      description: |
        **顶层数组只返回一级评论**（`level=1`），每个一级评论的 `children` 字段
        携带它的**完整子树**（二级 + 三级，三级封顶）。

        **历史（勿删）**：本契约早期版本在这里写的是「只返回一级评论，
        二三级由前端按 `parentId` 在一级评论下自行嵌套渲染」。**这是错的**——
        前端只拿到一级评论时，`parentId` 指向的父评论根本不在响应里，
        无从嵌套。实际后果：用户点「回复」→ 接口返回 200 →
        刷新后回复消失 → 用户以为系统坏了。**静默错误，不报任何错。**

        树形由**服务端组装**（N+1 查询集中在服务端一次做完），
        前端只负责按 `level` 决定缩进层级，`MAX_RENDER_DEPTH=3` 与
        `MAX_VISUAL_DEPTH=2` 是两个独立约束。

        **分页边界不变**：`lastId` / `size` / `nextCursor` **只作用于一级评论**。
        子树不参与一级分页 —— 把子树算进分页会导致「同一条一级评论
        在第 1 页出现、在第 2 页又出现」。
      parameters:
        - name: lastId
          in: query
          required: false
          schema: { type: integer, format: int64, nullable: true }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: 一级评论列表（每条带 children 子树）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCursorPageResponse'
        '500': { $ref: '#/components/responses/InternalError' }

  /post/{id}/comment/{commentId}/children:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - name: commentId
        in: path
        required: true
        description: 被溢出的那个评论 id（只查它的**直接**子回复，不再往下递归）
        schema: { type: integer, format: int64 }
    get:
      operationId: listCommentChildren
      tags: [comment]
      summary: 某条评论的全部直接子回复（分页）
      description: |
        **只查 `commentId` 的直接子回复，不递归。**
        二级的孩子是三级、三级没有孩子，所以递归查询最多一层就该停；
        真要再往下，前端拿本页返回的 id 再调一次即可。

        存在的理由是 `children` 有 20 条上限：溢出时前端用本端点补齐，
        **不是为了「一次性拿全部评论」**。

        `nextCursor` 按子回复自身的 `id` 游标分页，与一级列表口径一致
        （取 id 升序、返回用id 降序，故首页返回的是最新 20 条）。
      parameters:
        - name: lastId
          in: query
          required: false
          schema: { type: integer, format: int64, nullable: true }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: 直接子回复列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentChildrenPageResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # §5.4 F2 校内身份归属与认证
  # ===========================================================================

  /dict/school:
    get:
      operationId: getSchoolDict
      tags: [dict]
      summary: 学校字典（院系 + 年级，F11 引导第 1 步下拉）
      description: |
        一次返回**启用中**的院系与年级。结果已缓存（Redis，TTL 10min），
        与 `/tags` 的缓存要求同口径；字典由后台人工维护，低频变更。
        不做分页：字典量恒定在 60 条上下。

        **为什么合并成一个端点**：引导第 1 步的三个下拉要同时可用，
        分两次请求会出现「学院已选、年级还在转圈」的中间态——
        用户可能在年级尚未加载时就点了下一步。客户端进程内缓存一次即可。

        **为什么用户必须从字典里选**：AC-14（同院系推荐 / 筛选）依赖院系的相等判断。
        自由文本下「计算机学院」与「计科」是两个不同的值，同院系的人会被漏掉一半；
        院系改名（合并 / 更名是真实事件）后，存名称会让新老用户永久匹配不上。
        因此 `POST /user/school-profile` 与 `POST /onboarding/complete`
        只接受 `deptId` / `gradeId`，不接受名称字符串。

        **只返回 `enabled = 1` 的项**。学校撤销或合并院系时置 `enabled = 0`：
        新用户不再能选，但**历史用户仍持有该 id 且仍能解析出名称**，
        因此老用户主页不会显示空白。已毕业的年级同理保留在表中但不返回。

        **语义不对称**：`depts` 按 `schoolId` 过滤；`grades` 不带学校维度
        （2024 级在任何学校都是 2024 级，跨校同年级天然可比）。
        合并返回只是为了一次往返，不代表年级是学校的子集。
      parameters:
        - name: schoolId
          in: query
          description: |
            学校ID，**只作用于院系列表**。MVP 单校，不传默认 1。
            本端点是纯字典查询，不做「只能选本校」的限制——
            与 `POST /user/school-profile` 的强校验口径不同（那里涉及写入归属，有越权风险）。
          required: false
          schema:
            type: integer
            format: int64
            default: 1
      responses:
        '200':
          description: 院系与年级列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolDictResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /user/trust-status:
    get:
      operationId: getUserTrustStatus
      tags: [user]
      summary: 发布信誉清单（自己的）
      description: |
        设置页「账号与安全」信誉卡的数据源（2026-10-24 新增）。
        三条清单（认证/账龄/违规记录）+ 是否受信，与发帖信任闸门
        （ReviewTrustService）同一套判定——用户看到的必须和实际生效的一致。
        刻意不披露的：变体检测等审核细节不在此返回，只给结论性清单。
      responses:
        '200':
          description: 信誉清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTrustStatusResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /user/{id}/trust-badge:
    get:
      operationId: getUserTrustBadge
      tags: [user]
      summary: 他人主页的公开信誉徽章（2026-10-25）
      description: |
        只回「是否受信」一个布尔，供他人主页渲染「信誉良好」小徽章。

        **刻意模糊**：false 的原因可能是未认证、新号、或有前科，响应不区分——
        前端对 false 不渲染任何内容（不公开处刑、不让新号被误读）。
        判定与信任闸门（ReviewTrustService）/设置页信誉卡同源，
        三处显示必须严格一致。本人视角的完整清单走 `/user/trust-status`。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 被查看的用户 id
      responses:
        '200':
          description: 信誉徽章
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustBadgeResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /user/me:
    put:
      operationId: updateMyProfile
      tags: [user]
      summary: 更新个人资料（昵称 / 头像 / 学号）
      description: |
        仅支持三个字段：`nickname`、`avatarUrl`、`studentNo`。全部可选，只更新传入的字段。

        **`dept` 与 `grade` 已从本端点下线**。归属信息（院系 / 年级）改由
        `POST /user/school-profile`（引导第 1 步）或 `POST /onboarding/complete` 写入，
        且入参是**字典 id** 而非名称字符串。

        下线原因：这两个字段原先是自由文本，保留会让用户把 `user.dept` 写成任意字符串
        而 `dept_id` 不变，产生「展示名称与匹配 id 不一致」的脏数据——
        这正是字典化要消灭的那类问题。

        **传入已下线字段会返回 400 `PROFILE_FIELD_RETIRED`，不是静默忽略**。
        静默忽略会让调用方以为写入成功、实际数据未落库，
        这类「以为成功」的失败比直接报错难查得多。
        其余未声明字段（客户端版本差异带来的）仍按原样放过，不报错。

        注意：本端点**不做字典 id 校验**，因为它不接受字典 id。
        院系/年级若为 NULL（存量用户），本接口不会填充，需走 school-profile。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        '200':
          description: 已更新，返回用户完整信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /user/cover:
    put:
      operationId: updateMyCover
      tags: [user]
      summary: 设置或清除个人主页封面
      description: |
        单字段设置，**「传什么就是什么」**：`coverUrl` 传 `null` 或空串
        即恢复默认渐变封面。

        与 `PUT /user/me` 拆开的理由：那边的 `null` 一律表示「本次不改」，
        若把封面并进去，用户点「恢复默认」传 `null` 就会被当成空操作、
        界面上毫无反应——这类静默无效最难排查。

        `coverUrl` 引用 `/uploads/...` 时校验归属：必须是调用方自己上传的文件，
        否则返回 400（防止把别人相册里的图挂到自己主页上）。
        外部图床地址与老格式路径放行，与头像同规则。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                coverUrl:
                  type: string
                  nullable: true
                  maxLength: 512
                  description: 封面相对路径；`null` / 空串 = 恢复默认
      responses:
        '200':
          description: 已更新，返回用户完整信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /user/school-profile:
    post:
      operationId: upsertSchoolProfile
      tags: [verify]
      summary: 设置或更新学校 / 学院 / 年级
      description: |
        写入 `user.school_id`（MVP 恒为 1）、`user.dept_id`、`user.grade_id`，
        并在同一事务内把 `user.dept` / `user.grade` 更新为**从字典表取出的名称快照**。

        **入参是字典 id，不是名称字符串**。这是本轮的行为变更：
        改造前 `dept` / `grade` 是用户自由填的文本，
        而 AC-14 依赖院系相等判断，「计算机学院」与「计科」会落库成两个不同的值，
        同院系推荐与筛选同时失效。改为字典 id 后该问题从数据层根除。

        - `deptId` / `gradeId` 必须是**启用中**的字典项。
          不存在、已停用（学校撤销/合并、年级已毕业）、或 `deptId` 不属于该 `schoolId` 时，
          返回 **422 `DEPT_INVALID` / `GRADE_INVALID`**。
        - 响应同时回传 `deptId` 与 `deptName`（同理 `gradeId` / `gradeName`）：
          前端拿到名称可直接显示，拿到 id 可回填草稿，不必二次请求反查。

        这是 F11 引导第 1 步的落库动作，也是 AC-18 的判定依据：
        `deptId` 与 `gradeId` 均有值即视为未完成第 1 步的反面（已完成），
        前端必须阻断进入 Feed。
        **本接口不产生认证状态**，只填归属信息；认证走下面三个端点。

        兼容性：字典化之前注册的用户 `dept_id` / `grade_id` 为 NULL，
        此类用户仍被判定为「归属已填」，不会被拦在引导页（见 AC-18 兼容说明）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolProfileRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolProfileResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /user/verify/campus-email:
    post:
      operationId: sendCampusEmailCode
      tags: [verify]
      summary: 发起校园邮箱验证码
      description: |
        先做域名白名单校验（白名单来自 `application.yml` 的
        `campus.email-domain-whitelist`，逗号分隔，如 `mail.xxx.edu.cn,xxx.edu.cn`），
        不在名单内直接 422 `CAMPUS_EMAIL_NOT_ALLOWED`，**不写 Redis、不发信**
        —— 否则任意字符串会成为 Redis key 并被送去真实 SMTP 通道。

        通过白名单后**完整复用现有 `VerifyCodeServiceImpl.send(target, type)`**，
        `type` 传 `campus`。不新开辟验证码通道：邮箱通道（QQ SMTP）、
        6 位码、5 分钟 TTL、60s 限频、每日 10 次上限、原子读删 Lua 全部现成。
        超限返回 429（底层是 `CODE_TOO_FREQUENT(1021)` / `CODE_LIMIT_REACHED(1022)`，
        由 HTTP 映射表转成 429）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampusEmailSendRequest'
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 409 `CONFLICT` 该账号已完成校内认证，无需重复认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 422 `CAMPUS_EMAIL_NOT_ALLOWED(1032)` 邮箱域名不在校园白名单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /user/verify/campus-email/confirm:
    post:
      operationId: confirmCampusEmailCode
      tags: [verify]
      summary: 确认校园邮箱验证码
      description: |
        复用 `VerifyCodeServiceImpl.verify(target, code, "campus")`。
        校验通过后把 `user.verify_status` 置 1（已认证），写 `school_id`。
        原子读删走 `VerifyCodeServiceImpl.java:102-105` 的 Lua 脚本，
        **禁止改用 `opsForValue().getAndDelete()`**（Redis 5.0 会抛 `ERR unknown command`，
        已踩过一次坑，SPEC §11 第 1 条）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampusEmailConfirmRequest'
      responses:
        '200':
          description: 认证结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyStatusResponse'
        '400':
          description: 400 `CODE_INVALID(1020)` 验证码错误或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 409 `CONFLICT` 该账号已完成校内认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500': { $ref: '#/components/responses/InternalError' }

  /user/verify/student-no:
    post:
      operationId: submitStudentNoVerify
      tags: [verify]
      summary: 学号 + 姓名后两位（人工核验兜底）
      description: |
        **冷启动期的兜底路径**：校园邮箱未必人人有（部分学校邮箱未激活、
        毕业生邮箱已回收），所以必须留一条不依赖邮箱的通道。

        提交后不直接认证，而是 `user.verify_status` 置 2（审核中），
        同时往现有 `review_task` 表插一条由管理员人工核验的任务，
        **不新建审核机制**（复用 `ReviewService`，与 G1 举报同一条流）。
        管理员在手机端（OD-19）通过后由后台把 `verify_status` 置 1，
        驳回置 3 并回填理由。

        `studentNo` 走 `user.student_no` 唯一约束，已被他人占用返回 409
        `STUDENT_NO_EXISTS(1004)`。`nameTail` 是姓名后两位，如「张三」传「三」，
        「欧阳娜娜」传「娜娜」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentNoVerifyRequest'
      responses:
        '200':
          description: 已提交，进入人工核验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentNoVerifyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 409。已认证 / 已在审核中 / `STUDENT_NO_EXISTS(1004)` 学号已被使用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /user/verify/status:
    get:
      operationId: getVerifyStatus
      tags: [verify]
      summary: 当前认证状态
      description: |
        前端据 `canStrangerChat` / `canPublishAnnouncement` 决定是否禁用入口，
        不再在每个页面各写一遍判断（AC-11 的统一拦截口径，见 ARCHITECTURE §3 Q9）。
        未认证时不返回任何真实姓名或学号字段（AC-12）。
      responses:
        '200':
          description: 认证状态快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyStatusResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # §5.5 F11 新用户引导
  # ===========================================================================

  /onboarding/tags:
    get:
      operationId: listOnboardingTags
      tags: [onboarding]
      summary: 引导用推荐标签
      description: |
        引导第 2 步的候选集。与 `GET /tags` 的区别：本接口做**首次梯度**裁剪 ——
        每个 category 取 `use_count` 最高的若干条，总量 ≤ 60，
        保证第一屏先看到本校最热的标签而不是一份 60 条的完整字典。
        冷启动期 `use_count` 全为 0，退化为按 `sort` 升序取，结果稳定可重现。
      parameters:
        - name: size
          in: query
          description: 返回条数上限，默认 60，最大 60
          required: false
          schema:
            type: integer
            default: 60
            maximum: 60
      responses:
        '200':
          description: 引导候选标签
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingTagsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: 完成引导（批量写标签 + 批量关注，幂等）
      description: |
        一个事务做完三件事：写学校归属（`school_id` / `dept` / `grade`）、
        覆盖写兴趣标签、批量关注推荐用户。

        幂等键：用户维度。已完成的账号重复提交返回 200、`duplicated = true`、
        `message` 为「已完成」，不重复写标签、不重复关注。
        判据是 `user.onboarding_step = 3`（见 ARCHITECTURE §3 Q10，不新增表）。

        `followUserIds` 为空是合法的 —— 引导第 3 步允许一个都不选。
        关注复用现有 `RelationService`，已关注的不报错（跳过）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingCompleteRequest'
      responses:
        '200':
          description: 引导完成（含重复提交的「已完成」情形）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingCompleteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /onboarding/recommend-users:
    get:
      operationId: recommendOnboardingUsers
      tags: [onboarding]
      summary: 引导推荐关注的人
      description: |
        **冷启动期不上算法**（PRD §9 明确排除 AI 智能匹配）。
        确定性规则排序，优先级从高到低：
        1. 同院系（**`user.dept_id` 相等**）
        2. 同年级（**`user.grade_id` 相等**）
        3. 已通过校内认证（`verify_status = 1`）
        4. 曾有互动（近 7 天有发帖或评论，`post` / `comment` 表存在记录）
        5. `follower_count` 降序

        排除自己、已关注的、已拉黑的、`status != 0` 的账号。
        单校 MVP 下 `school_id` 恒为 1，该维度不参与排序但写进 SQL 以便后续扩校。

        **AC-14 的匹配依据已从名称改为字典 id**：原实现比的是 `user.dept` / `user.grade`
        字符串，「计算机学院」与「计科」不相等会让同院系的人漏掉一半，
        且院系改名后新老用户会永久匹配不上。改比 id 后，改名只影响展示文本，
        匹配关系自动保持正确。
        兼容：`dept_id` / `grade_id` 为 NULL 的存量用户（字典化前注册）
        回退到名称比较，不会被静默降级。
      parameters:
        - name: size
          in: query
          description: 返回条数，默认 12，最大 20
          required: false
          schema:
            type: integer
            default: 12
            maximum: 20
      responses:
        '200':
          description: 推荐用户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingRecommendUsersResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /discover/buddy:
    get:
      operationId: discoverWeeklyBuddies
      tags: [onboarding]
      summary: 本周搭子推荐（2026-10-25）
      description: |
        按共同兴趣标签主动撮合的「本周搭子」，与推荐关注（`/onboarding/recommend-users`）
        的三点口径差异：

        1. **标签主导**：打分为共同标签数 ×4 > 同院系 2 > 同年级 1，
           且 `common_tag_count = 0` 的人不进名单——搭子的本质是兴趣撮合，
           没共同兴趣的人留给「推荐关注」场景；
        2. **拉黑双向过滤**：我拉黑的、拉黑我的都不出现（推荐关注只单向过滤）；
        3. **只推可搭话的人**：`verify_status = 1` 且 `stranger_msg_enabled = 1`，
           否则点「想认识」直接被 ChatGuard 拒，白占名额。

        结果**按 ISO 周缓存**（Redis `buddy:week:{uid}:{周}`，TTL 8 天）：
        同一周内每次进发现页是同一批人，周一自然换一批。
        登录即可浏览（不要求已认证）；点「想认识」走 `POST /chat/send`，
        认证门槛由搭话链路（`@RequireVerified` + ChatGuard）自行拦截。
      parameters:
        - name: size
          in: query
          description: 返回条数，默认 6，上限走全局分页 clamp
          required: false
          schema:
            type: integer
            default: 6
      responses:
        '200':
          description: 本周搭子列表（结构与推荐关注一致，reason 为标签主导文案）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingRecommendUsersResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /onboarding/recommend-circles:
    get:
      operationId: recommendOnboardingCircles
      tags: [onboarding]
      summary: 引导推荐圈子
      description: |
        同样是规则排序，不上一算法：`circle.member_count` 降序 -> 与我的标签重合度降序
        -> `create_time` 降序。排除已加入的（查 `circle_member`）。
        冷启动期圈子可能不足，允许返回少于 `size` 条甚至空数组 —— 空态由前端
        展示引导文案 + 行动按钮（AC-19），**不允许出现空白页**。
      parameters:
        - name: size
          in: query
          description: 返回条数，默认 8，最大 20
          required: false
          schema:
            type: integer
            default: 8
            maximum: 20
      responses:
        '200':
          description: 推荐圈子列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingRecommendCirclesResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # 群管理（群信息头 + 群主/成员操作）。镜像单聊域,走独立四表
  # group / group_member / group_message / group_read。全部需登录,读 me
  # 走 AuthInterceptor 请求属性。群主操作返 403 NOT_GROUP_OWNER(1027),
  # 非成员返 404 NOT_GROUP_MEMBER(1026),满员返 409 GROUP_FULL(1045)。
  # 后端 GroupController.java。
  # ===========================================================================

  /group/{groupId}/members:
    get:
      operationId: getGroupMembers
      tags: [group]
      summary: 查群信息头（群名/人数/群主/公告 + 成员名单）
      description: 校验我是成员。群主排第一、我标 isSelf。非成员 404。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 群信息头
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberInfoResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addGroupMembers
      tags: [group]
      summary: 拉人（群成员均可）
      description: |
        把一批已存在、未入群的成员加进现有群，member_count 原子累加。
        权限：调用方须是该群成员（assertMember），不限于群主。满员 409 GROUP_FULL(1045)。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds: { type: array, items: { type: integer, format: int64 } }
      responses:
        '200':
          description: { added: 本次新增人数 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 群成员已满（GROUP_FULL 1045）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /group/{groupId}/kick:
    post:
      operationId: kickGroupMember
      tags: [group]
      summary: 踢人（仅群主）
      description: 把某普通成员移出（不能踢群主自己/自己），清其水位。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        '200': { description: 已移出 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /group/{groupId}/name:
    put:
      operationId: renameGroup
      tags: [group]
      summary: 群改名（仅群主）
      description: name 非空，否则 422 GROUP_NAME_EMPTY(1028)。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200': { description: 已改名 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /group/{groupId}/announcement:
    put:
      operationId: setGroupAnnouncement
      tags: [group]
      summary: 群公告（仅群主）
      description: 空串=清除。展示在群信息头公告条。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, nullable: true }
      responses:
        '200': { description: 已设置/清除公告 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /group/{groupId}/transfer:
    post:
      operationId: transferGroupOwner
      tags: [group]
      summary: 群主转让（仅群主，指定对象）
      description: 把群主位传给某群成员（须是群成员且非我），我降为普通成员留在群里。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwnerId]
              properties:
                newOwnerId: { type: integer, format: int64 }
      responses:
        '200': { description: 已转让 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /group/{groupId}/members/me:
    delete:
      operationId: leaveGroup
      tags: [group]
      summary: 退群
      description: 非群主→物理删我+减成员数+清我水位；群主退→还有他人则自动转让给第一个非我成员，只剩我则解散（物理清四表+软删群行）。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 已退出/已解散 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /group/{groupId}/mute:
    post:
      operationId: muteMember
      tags: [group]
      summary: 禁言某成员(仅群主)
      description: 群主把某普通成员设为被禁言(muted=true)或解除(muted=false)。muted 缺省视为 true。不能禁言群主自己。被禁言者发群消息被拒(GROUP_MUTED 1046)。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: integer, format: int64, description: 被禁言/解除的成员 id }
                muted: { type: boolean, default: true, description: true=禁言 false=解除,缺省 true }
      responses:
        '200': { description: 已设置禁言状态 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /group/{groupId}/mute-all:
    post:
      operationId: muteAllMembers
      tags: [group]
      summary: 禁言全员(仅群主)
      description: 群主把除自己外全部成员设为被禁言(muted=true)或解除(muted=false)。muted 缺省视为 true。幂等可重放。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                muted: { type: boolean, default: true, description: true=全员禁言 false=解除全员,缺省 true }
      responses:
        '200': { description: 已设置全员禁言状态 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /group/{groupId}/muted-me:
    get:
      operationId: groupMutedMe
      tags: [group]
      summary: 我是否被该群禁言
      description: 查我是否被该群群主禁言,前端据此禁用输入框/提示;后端发消息另有 GROUP_MUTED(1046) 兜底。
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: { muted: true/false }
          content:
            application/json:
              schema:
                type: object
                properties:
                  muted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }


  # ---------------------------------------------------------------------------
  # 圈子成员 / 活动报名者（2026-10-21 补录）
  #
  # 这两条此前没进契约，但端点早已存在并被前端使用 —— 契约漏记本身是问题：
  # 「端点清单以本文件为唯一依据」这句写在文件头上，漏了就等于没有依据。
  # ---------------------------------------------------------------------------

  /circle/{id}/members:
    get:
      operationId: circleMembers
      tags: [circle]
      summary: 圈子成员列表
      description: |
        按角色排序（1 圈主 / 2 圈管理 / 3 成员）返回该圈全部成员。

        **可见范围：所有人**（含非成员与未登录）。圈子是公开组织，
        「里面有哪些人」是加入决策的一部分。因此这里只下发
        昵称、头像、年级、学院 —— **不含学号**（SPEC AC-12）。

        含 `banStatus`：前端据此把已封禁成员从公开列表里滤掉，
        圈主/圈管理在管理面板内仍能看到他们。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成员数组，按 role 升序
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: 成功 }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: integer, format: int64 }
                        nickname: { type: string }
                        avatarUrl: { type: string, nullable: true }
                        role:
                          type: integer
                          description: 1 圈主 / 2 圈管理 / 3 普通成员
                          enum: [1, 2, 3]
                        banStatus:
                          type: integer
                          description: 圈内封禁 0 正常 / 1 封禁
                          enum: [0, 1]
                        banUntil:
                          type: string
                          format: date-time
                          nullable: true
                          description: 封禁到期；null 表示长期封禁或未封禁
                        joinTime:
                          type: string
                          format: date-time
                          nullable: true
                        grade:
                          type: string
                          nullable: true
                          description: 年级，如「2023级」（字典化前的老用户可能为 null）
                        dept:
                          type: string
                          nullable: true
                          description: 学院名称（同上，可能为 null）
        '404': { $ref: '#/components/responses/NotFound' }

  /activity/{id}/signups:
    get:
      operationId: activitySignups
      tags: [activity]
      summary: 活动报名者名单
      description: |
        按报名先后（`activity_signup.id` 升序）返回该活动的报名者。

        **为什么用 id 而不是 create_time 排序**：同一秒内批量报名时
        create_time 会撞，而 id 单调唯一。

        **可见范围：所有人**。这类活动常是线下见面，
        「知道同去的是谁」直接影响来不来、也关系到安全。
        因此只下发昵称与头像 —— 不含学号、年级、学院。

        与 `/activity/{id}` 拆成两个端点：名单是「可能变、可能很长」的数据，
        详情是「一次拿全」。拆开后详情页可以先渲染主体、名单后到。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 报名者数组，按报名先后
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: 成功 }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: integer, format: int64 }
                        nickname: { type: string }
                        avatarUrl: { type: string, nullable: true }
                        isMe:
                          type: boolean
                          description: 是否为当前查看者自己（未登录时恒 false）
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:

  # ---------------------------------------------------------------------------
  # 认证
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access>`。access token 有效期 15 分钟，
        refresh 7 天。由 `interceptor/AuthInterceptor.java` 校验，
        失败时拦截器直接写 HTTP 401 并短路，不进 Controller。
        刷新逻辑见 `frontend/src/utils/request.js` 的 401 单例队列。

  # ---------------------------------------------------------------------------
  # 复用参数
  # ---------------------------------------------------------------------------
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页返回的 nextCursor。首页不传
      schema:
        type: integer
        format: int64
        nullable: true
    Size:
      name: size
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
    ReportId:
      name: id
      in: path
      required: true
      description: 举报记录 id
      schema:
        type: integer
        format: int64
    AnnouncementId:
      name: id
      in: path
      required: true
      description: 公告 id
      schema:
        type: integer
        format: int64
    PostId:
      name: id
      in: path
      required: true
      description: 帖子 id
      schema:
        type: integer
        format: int64

  # ---------------------------------------------------------------------------
  # 复用响应
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: 400 `BAD_REQUEST` 参数缺失或格式错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: 401 `UNAUTHORIZED` 未登录或 token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: 403 `FORBIDDEN` / `USER_FROZEN(1001)` / `USER_CANCELLED(1002)` 无权限或账号不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ForbiddenAdmin:
      description: 403 `NOT_ADMIN(1025)` 需要管理员权限（AC-20）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: 404 `NOT_FOUND` 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: 409 `CONFLICT` 资源冲突（已认证 / 已处置 / 学号被占用）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unprocessable:
      description: 422 `UNPROCESSABLE` 业务校验失败（敏感词 / 标签超上限 / 置顶缺到期时间）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    TooManyRequests:
      description: 429 `TOO_MANY_REQUESTS` 操作过于频繁（搭话配额 / 验证码限频）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    InternalError:
      description: 500 `INTERNAL_ERROR` 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:

    # ---- 通用 -------------------------------------------------------------

    ErrorBody:
      type: object
      description: 错误响应体。data 字段被 @JsonInclude(NON_NULL) 省略
      required: [code, message]
      properties:
        code:
          type: integer
          description: ResultCode 枚举取值
          example: 1025
        message:
          type: string
          description: 可直接展示给用户的人类可读文案
          example: 需要管理员权限

    CursorPageEnvelope:
      type: object
      description: |
        游标分页外壳。字段名与 common/CursorPage.java 严格一致：
        list / nextCursor / hasMore。nextCursor 为 null 表示没有更多
      required: [hasMore, nextCursor]
      properties:
        list:
          type: array
          items: {}
        nextCursor:
          type: integer
          format: int64
          nullable: true
          description: 下一页游标；null 表示没有更多
        hasMore:
          type: boolean

    # ---- F3 / F4 ----------------------------------------------------------

    ReportSubmitRequest:
      type: object
      required: [targetType, targetId, reasonType]
      properties:
        targetType:
          type: integer
          description: |
            1用户 2帖子 3评论 4聊天消息 5搭子 6集市活动
            - 5搭子：buddy_post 表已建但无端点，只支持驳回/忽略，封禁会回 422
            - 6集市活动：2026-10-21 新增。此前集市误用 5，导致举报能提交、管理员无法处置
          enum: [1, 2, 3, 4, 5, 6]
          example: 4
        targetId:
          type: integer
          format: int64
          example: 88213
        reasonType:
          type: integer
          description: 1骚扰 2广告 3色情 4诈骗 5其他
          enum: [1, 2, 3, 4, 5]
          example: 1
        reasonText:
          type: string
          maxLength: 200
          description: 补充说明，可选
          example: 连续三天发游戏代练广告

    ReportSubmitData:
      type: object
      required: [reportId, duplicated]
      properties:
        reportId:
          type: integer
          format: int64
        duplicated:
          type: boolean
          description: true 表示此前已举报过同一目标，本次未创建新记录
        status:
          type: integer
          description: 0待审 1成立 2驳回
          enum: [0, 1, 2]

    ReportSubmitResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReportSubmitData'

    ReportVO:
      type: object
      required: [id, targetType, targetId, reasonType, status, createTime]
      properties:
        id:
          type: integer
          format: int64
        reporterId:
          type: integer
          format: int64
        reporterNickname:
          type: string
        targetType:
          type: integer
          enum: [1, 2, 3, 4, 5, 6]
          description: 1用户 2帖子 3评论 4聊天消息 5搭子(未上线) 6集市活动(2026-10-21 加)
        targetId:
          type: integer
          format: int64
        targetSummary:
          type: string
          description: 被举报对象的摘要文本，供管理员在手机上快速判断
          example: 今晚王者缺一个，来吗
        targetAuthorId:
          type: integer
          format: int64
          nullable: true
          description: |
            被举报内容的作者(2026-10-24 加)。targetType=1 时即被举报人本身。
            管理员处置的核心依据是「谁在发」;内容已物理删除时为 null。
        targetAuthorNickname:
          type: string
          nullable: true
          description: 作者昵称,与 targetAuthorId 同批解析
        reasonType:
          type: integer
          enum: [1, 2, 3, 4, 5]
        reasonText:
          type: string
          maxLength: 60
          description: 超过 60 字截断
        reasonTextTruncated:
          type: boolean
        status:
          type: integer
          enum: [0, 1, 2]
        handlerId:
          type: integer
          format: int64
          nullable: true
        handleTime:
          type: string
          format: date-time
          nullable: true
        createTime:
          type: string
          format: date-time

    AdminReportPageResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPageEnvelope'
                - type: object
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '#/components/schemas/ReportVO'
                    pendingCount:
                      type: integer
                      description: status=0 的总数，供手机端顶栏红点展示

    ReportHandleRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          description: ban 成立并封禁 / reject 驳回 / ignore 忽略
          enum: [ban, reject, ignore]
          example: ban
        banDays:
          type: integer
          description: action=ban 时必填。1/7/30，0 表示永久封禁
          enum: [0, 1, 7, 30]
        handleNote:
          type: string
          maxLength: 200
          description: 处置备注，写入 audit_log

    ReportHandleData:
      type: object
      required: [reportId, status, action]
      properties:
        reportId:
          type: integer
          format: int64
        status:
          type: integer
          enum: [0, 1, 2]
        action:
          type: string
          enum: [ban, reject, ignore]
        bannedUntil:
          type: string
          format: date-time
          nullable: true
          description: action=ban 时的解封时间；永久封禁为 null

    ReportHandleResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ReportHandleData'

    FeedbackSubmitRequest:
      type: object
      required: [category, content]
      properties:
        category:
          type: integer
          description: 1功能建议 2使用问题 3内容问题 4界面体验 5其他
          enum: [1, 2, 3, 4, 5]
          example: 2
        content:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            文字描述。上限 1000 字（与列宽一致），比举报的 200 字宽：
            反馈是「描述问题」而非「选一个原因」，复现步骤 + 现象 + 期望
            三段写下来 200 字往往只够写半句。
          example: 点开聊天页之后列表一直转圈，重开才好
        media:
          type: array
          maxItems: 9
          description: 图片 / 视频附件，可空。最多 9 个，与发帖媒体上限一致
          items:
            $ref: '#/components/schemas/FeedbackMediaItem'

    FeedbackMediaItem:
      type: object
      required: [type, url]
      properties:
        type:
          type: integer
          description: 1 图片 2 视频（与发帖媒体同码）
          enum: [1, 2]
          example: 1
        url:
          type: string
          maxLength: 500
          description: 上传接口返回的 OSS 相对路径
          example: uploads/2026/10/18/clip.mp4

    FeedbackSubmitData:
      type: object
      required: [status]
      properties:
        feedbackId:
          type: integer
          format: int64
        status:
          type: integer
          description: |
            0待处理 1已采纳 2已忽略。新提交恒为 0。
            回执带 status 是为了让前端提示「我们会看」而不是
            「已经改好了」—— 后者会误导用户。
          enum: [0, 1, 2]

    FeedbackSubmitResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FeedbackSubmitData'

    FeedbackVO:
      type: object
      required: [id, category, content, status, createTime]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userNickname:
          type: string
          nullable: true
          description: 提交人昵称，联表带出；用户已注销时为 null，前端降级为「已注销用户」
        category:
          type: integer
          enum: [1, 2, 3, 4, 5]
        content:
          type: string
          maxLength: 1000
        mediaJson:
          type: string
          nullable: true
          description: |
            `[{"type":"img","url":"..."}]`，与 `post.media` 同形，
            管理端复用同一套缩略图渲染。为空表示没传媒体。
        status:
          type: integer
          enum: [0, 1, 2]
        handlerId:
          type: integer
          format: int64
          nullable: true
        handleTime:
          type: string
          format: date-time
          nullable: true
        handleNote:
          type: string
          nullable: true
        createTime:
          type: string
          format: date-time

    AdminFeedbackPageResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPageEnvelope'
                - type: object
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '#/components/schemas/FeedbackVO'
                    pendingCount:
                      type: integer
                      description: status=0 的全量总数，供手机端顶栏红点

    FeedbackHandleRequest:
      type: object
      required: [action, handleNote]
      properties:
        action:
          type: string
          enum: [adopt, ignore]
          example: adopt
        handleNote:
          type: string
          minLength: 1
          maxLength: 200
          description: 处理说明，必填，写入 audit_log

    FeedbackHandleResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FeedbackSubmitData'

    NotifyVO:
      type: object
      description: |
        站内通知项。`type` 取值：1被关注 2被赞 3被评 4私信 5活动
        6审核中 7审核通过 8审核未通过 9被@ 10集市留言 11反馈回复。
        `summary` 由后端按 type 硬拼（如「回复了你的反馈」），
        `content` 仅 type=11 有值，存反馈回复原文。
      properties:
        id:
          type: integer
          format: int64
        type:
          type: integer
          example: 11
        targetId:
          type: integer
          format: int64
          description: 关联实体 id（type=11 时为反馈 id）
        postId:
          type: integer
          format: int64
          nullable: true
        actorId:
          type: integer
          format: int64
          nullable: true
          description: 触发者 id；type=11（反馈回复）**恒为 null**，管理员身份对用户匿名
        actor:
          allOf:
            - $ref: '#/components/schemas/UserVO'
          nullable: true
          description: 触发者资料；type=11（反馈回复）**恒为 null**
        summary:
          type: string
          example: 回复了你的反馈
        content:
          type: string
          nullable: true
          maxLength: 500
          description: 自由文本通知内容；仅 type=11（反馈回复）有值，存原文
        isRead:
          type: boolean
        createTime:
          type: string
          format: date-time

    ChatSendRequest:
      type: object
      required: [toUserId, content]
      properties:
        toUserId:
          type: integer
          format: int64
          example: 1024
        content:
          type: string
          minLength: 1
          maxLength: 500
          description: 搭话内容。首条搭话前端限制 50 字，服务端统一放宽到 500
          example: 周五下午三点三号场，缺两个人，来吗
        replyToId:
          type: integer
          format: int64
          nullable: true
          description: 引用回复的消息 id，同会话才允许

    ChatSendData:
      type: object
      required: [msgId]
      properties:
        msgId:
          type: integer
          format: int64
        isStranger:
          type: boolean
          description: 本次是否属于向陌生人发起（用于前端埋点）
        remainingNewPeerQuota:
          type: integer
          nullable: true
          description: |
            本次为向新对象发起首条时，返回剩余「新对象」额度；
            非新对象场景为 null。前端据此刷新「还能搭话 N 人」文案

    ChatSendResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ChatSendData'

    StrangerQuotaData:
      type: object
      required: [remainingNewPeer, remainingPerPeer]
      properties:
        dailyNewPeerLimit:
          type: integer
          description: 每日最多可向几个新对象发起，来自 application.yml
          example: 5
        dailyNewPeerUsed:
          type: integer
          example: 1
        remainingNewPeer:
          type: integer
          description: 今日剩余可发起的新对象数
          example: 4
        perPeerDailyLimit:
          type: integer
          example: 20
        remainingPerPeer:
          type: integer
          nullable: true
          description: |
            对指定 peer 的当日剩余条数。不传 peerId 时为 null，
            因为「剩余」必须针对某个具体对象才有意义
          example: 18
        resetAt:
          type: string
          format: date-time
          description: 次日 00:00（Asia/Shanghai）
        strangerMsgEnabled:
          type: boolean
          description: 我是否接收陌生人消息。false 时前端应提示「你已关闭陌生人搭话」

    StrangerQuotaResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StrangerQuotaData'

    # ---- 标签 --------------------------------------------------------------

    TagItem:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 王者荣耀
        category:
          type: integer
          description: 1兴趣 2游戏 3运动 4学习 5生活
          enum: [1, 2, 3, 4, 5]
        useCount:
          type: integer
          description: 被多少用户选中
          example: 137

    TagGroup:
      type: object
      required: [category, categoryName, tags]
      properties:
        category:
          type: integer
          enum: [1, 2, 3, 4, 5]
        categoryName:
          type: string
          example: 游戏
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagItem'

    TagTreeResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [groups, total]
              properties:
                groups:
                  type: array
                  items:
                    $ref: '#/components/schemas/TagGroup'
                total:
                  type: integer
                  example: 52

    UserTagsPutRequest:
      type: object
      required: [tagIds]
      properties:
        tagIds:
          type: array
          maxItems: 8
          description: 全量覆盖。空数组表示清空我的标签
          items:
            type: integer
            format: int64
          example: [12, 27, 33]

    UserTagsPutResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [tagIds]
              properties:
                tagIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/TagItem'

    UserTagsGetResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              type: object
              required: [userId, tags]
              properties:
                userId:
                  type: integer
                  format: int64
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/TagItem'

    # ---- 公告 --------------------------------------------------------------

    AnnouncementPublisher:
      type: object
      required: [id, nickname, verified]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
          example: 教务处通知君
        avatarUrl:
          type: string
          nullable: true
        verified:
          type: boolean
          description: 是否已通过校内认证（AC-12：认证徽章只展示到这一层）
        schoolName:
          type: string
          nullable: true
          description: 已认证时返回，如「XX 大学」；未认证为 null

    AnnouncementListItem:
      type: object
      required: [id, title, category, isTop, status, publishTime, isRead]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          example: 关于 2026 级新生选课的通知
        summary:
          type: string
          description: 正文前 80 字，列表页用，避免整篇下发拖慢移动端首屏
          example: 本学期通识选修课将于 9 月 12 日开放，请同学们提前完成培养方案核对……
        category:
          type: integer
          description: 1教务 2后勤 3活动 4社团 5紧急 6其他
          enum: [1, 2, 3, 4, 5, 6]
        isTop:
          type: integer
          description: 0否 1是。置顶且在 topExpireTime 之前才生效
          enum: [0, 1]
        topExpireTime:
          type: string
          format: date-time
          nullable: true
        status:
          type: integer
          enum: [0, 1, 2]
        publishTime:
          type: string
          format: date-time
          nullable: true
        readCount:
          type: integer
        isRead:
          type: boolean
          description: 当前用户是否已读
        publisher:
          $ref: '#/components/schemas/AnnouncementPublisher'

    AnnouncementPageResponse:
      allOf:
        - $ref: '#/components/schemas/ResultMeta'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPageEnvelope'
                - type: object
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '#/components/schemas/AnnouncementListItem'

    AnnouncementDetailData:
      type: object
      required: [id, title, content, category, isRead]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
